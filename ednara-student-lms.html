/* ── Mobile hook ─────────────────────────────────────────────────────────── */
function useIsMobile(bp=768){
  const [m,setM]=useState(()=>window.innerWidth<=bp);
  useEffect(()=>{
    const h=()=>setM(window.innerWidth<=bp);
    window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);
  },[bp]);
  return m;
}

/* ── Question Diagram (inline SVG images used inside practice/exam questions) ── */
function TreeNode({x,y,val,color}){
  return(
    <g>
      <circle cx={x} cy={y} r={18} fill="#fff" stroke={color} strokeWidth={2}/>
      <text x={x} y={y+5} textAnchor="middle" fontSize={13} fontWeight={700} fontFamily="Manrope" fill={color}>{val}</text>
    </g>
  );
}
function TreeEdge({x1,y1,x2,y2,color}){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len;
  return <line x1={x1+ux*18} y1={y1+uy*18} x2={x2-ux*18} y2={y2-uy*18} stroke={color} strokeWidth={1.6}/>;
}
function QuestionDiagram({kind,alt}){
  const c=T.p;
  let nodes,edges,vb="0 0 400 210";
  if(kind==="minheap"){
    nodes=[{x:200,y:28,v:10},{x:100,y:92,v:20},{x:300,y:92,v:15},{x:50,y:156,v:30},{x:150,y:156,v:25},{x:250,y:156,v:18},{x:350,y:156,v:40}];
    edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
  }else if(kind==="bst"){
    vb="0 0 400 210";
    nodes=[{x:200,y:26,v:8},{x:110,y:82,v:3},{x:300,y:82,v:10},{x:60,y:138,v:1},{x:160,y:138,v:6},{x:350,y:138,v:14},
      {x:130,y:194,v:4},{x:190,y:194,v:7},{x:330,y:194,v:13}];
    edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[4,6],[4,7],[5,8]];
  }else{
    return null;
  }
  return(
    <div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:12,padding:"16px 12px",marginBottom:22,display:"flex",justifyContent:"center"}}>
      <svg viewBox={vb} role="img" aria-label={alt||"Question diagram"} style={{width:"100%",maxWidth:360,height:"auto",display:"block"}}>
        {edges.map(([a,b],i)=>(
          <TreeEdge key={i} x1={nodes[a].x} y1={nodes[a].y} x2={nodes[b].x} y2={nodes[b].y} color={T.bdr==="#E8E8EF"?"#C7C7D8":T.bdr}/>
        ))}
        {nodes.map((n,i)=>(
          <TreeNode key={i} x={n.x} y={n.y} val={n.v} color={c}/>
        ))}
      </svg>
    </div>
  );
}

/* ── Icon ────────────────────────────────────────────────────────────────── */
function Ic({n,sz=20,fill=0,wght=400,color,style:ext={},label}){
  return(
    <span className="msr" aria-hidden={label?undefined:true} role={label?"img":undefined} aria-label={label}
      style={{fontSize:sz,color:color||"inherit",
        fontVariationSettings:`'FILL' ${fill},'wght' ${wght},'GRAD' 0,'opsz' ${sz}`,
        lineHeight:1,...ext}}>
      {n}
    </span>
  );
}

/* ── Time helpers (data-independent, reusable) ─────────────────────────── */
function relTime(d){
  const mins=Math.max(0,Math.round((NOTIF_NOW-d)/60000));
  if(mins<1)return"Just now";
  if(mins<60)return`${mins} min ago`;
  const hrs=Math.round(mins/60);
  const sameDay=d.toDateString()===NOTIF_NOW.toDateString();
  if(hrs<24&&sameDay)return`${hrs} hr${hrs>1?"s":""} ago`;
  const yest=new Date(NOTIF_NOW);yest.setDate(yest.getDate()-1);
  if(d.toDateString()===yest.toDateString())return"Yesterday";
  const days=Math.round(hrs/24);
  if(days<7)return`${days} day${days>1?"s":""} ago`;
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function notifGroup(d){
  if(d.toDateString()===NOTIF_NOW.toDateString())return"Today";
  const yest=new Date(NOTIF_NOW);yest.setDate(yest.getDate()-1);
  if(d.toDateString()===yest.toDateString())return"Yesterday";
  return"Earlier";
}

/* ── Toast system ───────────────────────────────────────────────────────
   Separate from the notification panel: toasts are immediate feedback for
   an action just taken (submit, save) and are not persisted anywhere; the
   panel above is the durable, reviewable record. pushToast() is a small
   global dispatch (matching this file's existing window.__ednara_* pattern
   used by PracticeSetupScreen) so any screen can fire a toast without prop
   drilling through the whole page tree. */
function pushToast(t){
  if(typeof window!=="undefined"&&typeof window.__ednaraToast==="function"){
    window.__ednaraToast(t);
  }
}
const TOAST_ICON={success:"check_circle",error:"error",warning:"warning",info:"info"};
const TOAST_STYLE={
  success:{c:T.ok,  bg:T.okBg},
  error:  {c:T.err, bg:T.errBg},
  warning:{c:T.warn,bg:T.warnBg},
  info:   {c:T.info,bg:T.infoBg},
};
/* Hook owning the live toast stack; mounted once at the App() root so toasts
   survive page navigation. Handles auto-dismiss (errors stay longer),
   duplicate-message suppression, and a stack cap so toasts can't pile up
   and obscure the page. */
function useToastStack(){
  const [toasts,setToasts]=useState([]);
  const seq=useRef(1);
  const dismiss=useCallback(id=>setToasts(ts=>ts.filter(t=>t.id!==id)),[]);
  useEffect(()=>{
    window.__ednaraToast=(t)=>{
      const variant=t.variant||"info";
      setToasts(ts=>{
        if(ts.some(x=>x.message===t.message))return ts; // suppress duplicate
        const id=seq.current++;
        const entry={id,variant,message:t.message,action:t.action||null};
        const next=[...ts,entry];
        const capped=next.length>4?next.slice(next.length-4):next;
        const lifespan=variant==="error"?9000:(t.duration||5000);
        setTimeout(()=>dismiss(id),lifespan);
        return capped;
      });
    };
    return()=>{ if(window.__ednaraToast)delete window.__ednaraToast; };
  },[dismiss]);
  return{toasts,dismiss};
}
function ToastStack({toasts,onDismiss}){
  if(!toasts.length)return null;
  return(
    <div aria-live="polite" aria-atomic="false" style={{position:"fixed",top:16,right:16,zIndex:300,
      display:"flex",flexDirection:"column",gap:10,width:"min(360px, calc(100vw - 32px))"}}>
      {toasts.map(t=>{
        const cfg=TOAST_STYLE[t.variant]||TOAST_STYLE.info;
        return(
          <div key={t.id} role="status" style={{background:T.sur,border:`1px solid ${T.bdr}`,
            borderLeft:`4px solid ${cfg.c}`,borderRadius:12,boxShadow:T.shadow.pop,padding:"12px 14px",
            display:"flex",gap:10,alignItems:"flex-start",animation:"fadeUp .25s ease"}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:cfg.bg,display:"flex",alignItems:"center",
              justifyContent:"center",flexShrink:0,marginTop:1}}>
              <Ic n={TOAST_ICON[t.variant]||TOAST_ICON.info} sz={14} color={cfg.c} fill={1}/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:600,color:T.txt,lineHeight:1.35}}>{t.message}</div>
              {t.action&&<button onClick={()=>{t.action.onClick&&t.action.onClick();onDismiss(t.id);}}
                style={{marginTop:6,background:"none",border:"none",padding:0,color:T.p,fontWeight:700,fontSize:12.5,
                cursor:"pointer",fontFamily:"inherit"}}>{t.action.label}</button>}
            </div>
            <button onClick={()=>onDismiss(t.id)} aria-label="Dismiss notification"
              style={{background:"none",border:"none",padding:2,cursor:"pointer",color:T.muted,flexShrink:0,display:"flex"}}>
              <Ic n="close" sz={16}/>
            </button>
          </div>
        );
      })}
    </div>
  );
}

/* ── Notification Bell + Panel ──────────────────────────────────────────
   Enhances the existing header bell (previously a static icon with a fixed
   red dot) rather than adding a second entry point. Desktop/tablet render a
   bell-anchored popover reusing TopBar's existing profile-menu styling
   (same radius/shadow/z-index/click-outside pattern); mobile renders a
   bottom-sheet so the full list stays reachable with no horizontal
   overflow. Opening the panel never marks anything read — only opening a
   notification (or "Mark all as read") does. ── */
function NotificationCenter({mob,onNav}){
  const [items,setItems]=useState(NOTIFICATIONS);
  const [open,setOpen]=useState(false);
  const [filter,setFilter]=useState("all"); // "all" | "unread"
  const wrapRef=useRef(null);
  const btnRef=useRef(null);

  useEffect(()=>{
    if(!open)return;
    const onDoc=e=>{
      if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);
    };
    const onKey=e=>{ if(e.key==="Escape"){setOpen(false);btnRef.current&&btnRef.current.focus();} };
    document.addEventListener("mousedown",onDoc);
    document.addEventListener("keydown",onKey);
    return()=>{document.removeEventListener("mousedown",onDoc);document.removeEventListener("keydown",onKey);};
  },[open]);

  const unreadCount=items.filter(i=>i.unread).length;
  const badgeText=unreadCount>99?"99+":String(unreadCount);

  const markAllRead=()=>setItems(its=>its.map(i=>i.unread?{...i,unread:false}:i));
  const openNotif=n=>{
    setItems(its=>its.map(i=>i.id===n.id?{...i,unread:false}:i));
    if(n.dest){ setOpen(false); onNav&&onNav(n.dest); }
  };

  const filtered=filter==="unread"?items.filter(i=>i.unread):items;
  const sorted=[...filtered].sort((a,b)=>b.createdAt-a.createdAt);
  const groups=["Today","Yesterday","Earlier"]
    .map(g=>({g,list:sorted.filter(n=>notifGroup(n.createdAt)===g)}))
    .filter(x=>x.list.length>0);

  const panelBody=(
    <>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",
        borderBottom:`1px solid ${T.bdr}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
          <h2 id="notif-panel-title" style={{fontSize:15,fontWeight:800,color:T.txt,margin:0,fontFamily:"Manrope,sans-serif"}}>
            Notifications
          </h2>
          {unreadCount>0&&<Badge color={T.p} bg={T.pLt}>{unreadCount} new</Badge>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
          {unreadCount>0&&(
            <button onClick={markAllRead} style={{background:"none",border:"none",color:T.p,fontWeight:700,
              fontSize:12.5,cursor:"pointer",fontFamily:"inherit",padding:"6px 6px",borderRadius:8,whiteSpace:"nowrap"}}>
              Mark all as read
            </button>
          )}
          {mob&&(
            <button onClick={()=>setOpen(false)} aria-label="Close notifications"
              style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:8,width:30,height:30,
              display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:T.muted}}>
              <Ic n="close" sz={16}/>
            </button>
          )}
        </div>
      </div>
      <div style={{display:"flex",gap:6,padding:"10px 16px",borderBottom:`1px solid ${T.bdr}`,flexShrink:0}}>
        {["all","unread"].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} aria-pressed={filter===f}
            style={{padding:"6px 12px",borderRadius:99,border:`1.5px solid ${filter===f?T.p:T.bdr}`,
            background:filter===f?T.pLt:"transparent",color:filter===f?T.p:T.muted,fontSize:12.5,fontWeight:700,
            cursor:"pointer",fontFamily:"inherit"}}>
            {f==="all"?"All":`Unread${unreadCount>0?` (${unreadCount})`:""}`}
          </button>
        ))}
      </div>
      <div style={{overflowY:"auto",flex:1,WebkitOverflowScrolling:"touch"}}>
        {sorted.length===0?(
          <div style={{padding:"44px 24px",textAlign:"center",color:T.muted}}>
            <Ic n={filter==="unread"?"task_alt":"notifications_none"} sz={32} color={T.bdr}/>
            <div style={{marginTop:10,fontSize:13.5,fontWeight:700,color:T.txt}}>
              {filter==="unread"?"You’re all caught up":"No notifications yet"}
            </div>
            <div style={{marginTop:4,fontSize:12.5,lineHeight:1.5}}>
              {filter==="unread"
                ?"There are no unread notifications right now."
                :"We’ll let you know here when something needs your attention."}
            </div>
          </div>
        ):groups.map(({g,list})=>(
          <div key={g}>
            <div style={{padding:"8px 16px 4px",fontSize:11,fontWeight:800,color:T.muted,
              textTransform:"uppercase",letterSpacing:.4,background:T.bg,position:"sticky",top:0}}>{g}</div>
            {list.map(n=><NotifItem key={n.id} n={n} onOpen={openNotif}/>)}
          </div>
        ))}
      </div>
    </>
  );

  return(
    <div ref={wrapRef} style={{position:"relative"}}>
      <button ref={btnRef} onClick={()=>setOpen(o=>!o)}
        aria-label={unreadCount>0?`Notifications, ${badgeText} unread`:"Notifications"}
        aria-expanded={open} aria-haspopup="dialog"
        style={{position:"relative",background:open?T.pLt:T.bg,border:`1px solid ${open?T.p:T.bdr}`,
        borderRadius:10,width:38,height:38,cursor:"pointer",display:"flex",alignItems:"center",
        justifyContent:"center",color:open?T.p:T.muted,flexShrink:0,transition:"background .12s,border-color .12s"}}
        onMouseEnter={e=>{if(!open)e.currentTarget.style.background="#F1F1F7";}}
        onMouseLeave={e=>{if(!open)e.currentTarget.style.background=T.bg;}}>
        <Ic n="notifications" sz={20} fill={open?1:0}/>
        {unreadCount>0&&(
          <span aria-hidden="true" style={{position:"absolute",top:4,right:4,minWidth:16,height:16,
            padding:"0 3px",borderRadius:99,background:T.err,border:`2px solid ${T.sur}`,color:"#fff",
            fontSize:9.5,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>
            {badgeText}
          </span>
        )}
      </button>

      {open&&!mob&&(
        <div role="dialog" aria-labelledby="notif-panel-title"
          style={{position:"absolute",right:0,top:"calc(100% + 8px)",width:384,maxHeight:"min(560px, calc(100vh - 100px))",
          background:T.sur,border:`1.5px solid ${T.bdr}`,borderRadius:14,boxShadow:T.shadow.pop,
          zIndex:60,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {panelBody}
        </div>
      )}

      {open&&mob&&(
        <div style={{position:"fixed",inset:0,background:"rgba(15,15,25,.45)",zIndex:80}} onClick={()=>setOpen(false)}>
          <div role="dialog" aria-labelledby="notif-panel-title" aria-modal="true" onClick={e=>e.stopPropagation()}
            style={{position:"absolute",left:0,right:0,bottom:0,maxHeight:"82vh",background:T.sur,
            borderRadius:"18px 18px 0 0",boxShadow:T.shadow.modal,display:"flex",flexDirection:"column",
            animation:"fadeUp .25s ease"}}>
            <div aria-hidden="true" style={{width:36,height:4,borderRadius:99,background:T.bdr,margin:"10px auto 2px",flexShrink:0}}/>
            {panelBody}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Shared a11y primitives ─────────────────────────────────────────────── */
function Modal({open,onClose,labelledBy,children,maxWidth=560,closeOnBackdrop=false,mob}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const prev=document.activeElement;
    const el=ref.current;
    const q='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
    setTimeout(()=>{const f=el&&el.querySelector(q);f&&f.focus();},0);
    const onKey=e=>{
      if(e.key==="Escape"&&onClose){e.stopPropagation();onClose();}
      if(e.key==="Tab"&&el){
        const f=[...el.querySelectorAll(q)].filter(x=>!x.disabled&&x.offsetParent!==null);
        if(!f.length)return;
        const first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    };
    document.addEventListener("keydown",onKey,true);
    return()=>{document.removeEventListener("keydown",onKey,true);prev&&prev.focus&&prev.focus();};
  },[open,onClose]);
  if(!open)return null;
  return(
    <div style={{position:"fixed",inset:0,zIndex:99999,display:"flex",alignItems:"center",justifyContent:"center",
      padding:mob?"12px":"20px",background:"rgba(15,15,25,.72)",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)"}}
      onClick={()=>closeOnBackdrop&&onClose&&onClose()}>
      <div ref={ref} role="dialog" aria-modal="true" aria-labelledby={labelledBy}
        onClick={e=>e.stopPropagation()}
        style={{background:T.sur,borderRadius:mob?12:16,width:"100%",maxWidth,maxHeight:"96vh",
          display:"flex",flexDirection:"column",boxShadow:T.shadow.modal,overflow:"hidden"}}>
        {children}
      </div>
    </div>
  );
}

function Checkbox({checked,onChange,label,disabled,size=20}){
  const [foc,setFoc]=useState(false);
  return(
    <label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:disabled?"not-allowed":"pointer",opacity:disabled?.55:1}}>
      <span style={{position:"relative",width:size,height:size,flexShrink:0,marginTop:1}}>
        <input type="checkbox" checked={!!checked} disabled={disabled}
          onChange={e=>onChange&&onChange(e.target.checked)}
          onFocus={()=>setFoc(true)} onBlur={()=>setFoc(false)}
          style={{position:"absolute",inset:0,width:"100%",height:"100%",margin:0,opacity:0,cursor:"inherit"}}/>
        <span aria-hidden="true" style={{position:"absolute",inset:0,borderRadius:6,
          border:`2px solid ${checked?T.p:T.bdr}`,background:checked?T.p:T.sur,
          boxShadow:foc?`0 0 0 2px ${T.sur},0 0 0 4px ${T.p}`:"none",
          display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",transition:"box-shadow .1s"}}>
          {checked&&<Ic n="check" sz={size*0.65} color="#fff"/>}
        </span>
      </span>
      {label&&<span style={{fontSize:13,color:T.txt,lineHeight:1.5}}>{label}</span>}
    </label>
  );
}

function QPill({n,state="none",active,onClick,size=38}){
  const map={
    answered:{bd:T.ok,bg:T.ok,fg:"#fff",ic:"check"},
    wrong:{bd:T.err,bg:T.err,fg:"#fff",ic:"close"},
    flagged:{bd:T.warn,bg:T.warnBg,fg:T.warn,ic:"flag"},
    skipped:{bd:T.bdr,bg:T.sur,fg:T.muted,ic:"redo"},
    none:{bd:T.bdr,bg:T.sur,fg:T.muted,ic:null},
  };
  const s=active?{bd:T.p,bg:T.p,fg:"#fff",ic:null}:(map[state]||map.none);
  const stateWord=active?", current question":state==="answered"?", answered":state==="wrong"?", incorrect":state==="flagged"?", flagged for review":state==="skipped"?", skipped":", not answered";
  return(
    <button onClick={onClick} aria-current={active?"true":undefined} aria-label={`Question ${n}${stateWord}`}
      style={{minWidth:size,height:size,borderRadius:10,border:`2px solid ${s.bd}`,background:s.bg,color:s.fg,
        fontSize:12,fontWeight:700,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",
        gap:2,padding:"0 6px",fontFamily:"inherit",flexShrink:0}}>
      {n}{s.ic&&<Ic n={s.ic} sz={12} color={s.fg} fill={1}/>}
    </button>
  );
}

function Stepper({value,onChange,min=0,max=99,color=T.p,ariaLabel="count"}){
  const clamp=v=>Math.max(min,Math.min(max,isNaN(v)?min:v));
  const btn={width:36,height:36,borderRadius:8,border:`1.5px solid ${T.bdr}`,background:T.sur,
    display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontFamily:"inherit"};
  return(
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <button onClick={()=>onChange(clamp(value-1))} disabled={value<=min} aria-label={`Decrease ${ariaLabel}`}
        style={{...btn,cursor:value<=min?"not-allowed":"pointer",opacity:value<=min?.4:1}}>
        <Ic n="remove" sz={16} color={color}/>
      </button>
      <input type="number" inputMode="numeric" value={value} aria-label={ariaLabel}
        onChange={e=>onChange(parseInt(e.target.value)||0)}
        onBlur={e=>onChange(clamp(parseInt(e.target.value)))}
        style={{width:56,padding:"8px",borderRadius:8,border:`1.5px solid ${T.bdr}`,
          fontSize:14,fontWeight:700,color,textAlign:"center",fontFamily:"Manrope",background:T.sur}}/>
      <button onClick={()=>onChange(clamp(value+1))} disabled={value>=max} aria-label={`Increase ${ariaLabel}`}
        style={{...btn,cursor:value>=max?"not-allowed":"pointer",opacity:value>=max?.4:1}}>
        <Ic n="add" sz={16} color={color}/>

/* ── Data-viz primitives ─────────────────────────────────────────────────── */
function Sparkline({data,color=T.p,uid,width=56,height=24}){
  const max=Math.max(...data),min=Math.min(...data),range=(max-min)||1;
  const pts=data.map((v,i)=>[(i/(data.length-1))*width,height-((v-min)/range)*height]);
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${path} L${width},${height} L0,${height} Z`;
  const last=pts[pts.length-1];
  const gid=`spk-${uid}`;
  return(
    <svg width={width} height={height} style={{display:"block",overflow:"visible",flexShrink:0}}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity=".22"/>
        <stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <path d={area} fill={`url(#${gid})`}/>
      <path d={path} fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={last[0]} cy={last[1]} r="2.4" fill={color}/>
    </svg>
  );
}

function RadialProgress({value,size=84,stroke=7,color="#fff",track="rgba(255,255,255,.22)",sub}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c-(value/100)*c;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          style={{transition:"stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontSize:size*.24,fontWeight:800,color:"#fff",fontFamily:"Manrope",lineHeight:1}}>{value}%</div>
        {sub&&<div style={{fontSize:size*.1,color:"rgba(255,255,255,.82)",marginTop:3,fontWeight:600}}>{sub}</div>}
      </div>
    </div>
  );
}

function WeeklyBars({data,height=110}){

function ScoreTrend({data,height=120}){
  const W=560,PAD=8,min=50,max=100;
  const stepX=(W-PAD*2)/(data.length-1);
  const pts=data.map((d,i)=>[PAD+i*stepX,PAD+(1-(d.v-min)/(max-min))*(height-PAD*2)]);
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area=`${path} L${pts[pts.length-1][0]},${height-PAD} L${pts[0][0]},${height-PAD} Z`;
  return(
    <div>
      <svg viewBox={`0 0 ${W} ${height}`} style={{width:"100%",height,display:"block",overflow:"visible"}}>
        <defs><linearGradient id="scoreFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={T.p} stopOpacity=".16"/>
          <stop offset="100%" stopColor={T.p} stopOpacity="0"/>
        </linearGradient></defs>
        {[.25,.5,.75].map(f=>(
          <line key={f} x1={PAD} x2={W-PAD} y1={PAD+f*(height-PAD*2)} y2={PAD+f*(height-PAD*2)}
            stroke={T.bdr} strokeWidth="1" strokeDasharray="3,5"/>
        ))}
        <path d={area} fill="url(#scoreFill)"/>
        <path d={path} fill="none" stroke={T.p} strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((p,i)=>{
          const isLast=i===pts.length-1;
          return(
            <g key={i}>
              <circle cx={p[0]} cy={p[1]} r={isLast?5:3.5} fill={isLast?T.p:"#fff"} stroke={T.p} strokeWidth="2"/>
              {isLast&&<text x={p[0]} y={p[1]-14} textAnchor="end" fontSize="13" fontWeight="800" fill={T.p} fontFamily="Manrope">{data[i].v}%</text>}
            </g>
          );
        })}
      </svg>
      <div style={{display:"flex",marginTop:2}}>
        {data.map((d,i)=>(
          <div key={i} style={{flex:1,textAlign:"center",fontSize:11,fontWeight:500,color:T.muted}}>{d.l}</div>
        ))}
      </div>
    </div>
  );
}

function StreakHeatmap({data}){
  // Rolling calendar — show the last ~5 weeks ending today
  const today=new Date();
  const todayY=today.getFullYear(), todayM=today.getMonth(), todayD=today.getDate();
  const dayHeaders=["S","M","T","W","T","F","S"];

  // Build 35-day grid ending today, aligned so today is in the last row
  const totalCells=35;
  const endDay=today.getDay(); // 0=Sun
  const trailingBlank=6-endDay; // blanks after today to complete week

  const cells=[]; // {date: Date|null, isFuture: bool}
  // start from (totalCells - trailingBlank - 1) days before today
  const startOffset=totalCells - trailingBlank - 1;
  for(let i=startOffset;i>=0;i--){
    const d=new Date(todayY,todayM,todayD-i);
    cells.push({date:d,isFuture:false});
  }
  for(let i=0;i<trailingBlank;i++){
    const d=new Date(todayY,todayM,todayD+i+1);
    cells.push({date:d,isFuture:true});
  }

  const levelColors=[T.bg,T.pLt,T.pMd+"77",T.pMd,T.p];
  const levelText  =["#B4B4C0",T.pDk,"#fff","#fff","#fff"];

  const getLevel=(idx)=>data[idx%data.length]||0;

  // Group by month for header display
  const firstDate=cells[0].date, lastDate=cells[totalCells-1].date;
  const monthLabel=firstDate.getMonth()===lastDate.getMonth()
    ?`${firstDate.toLocaleString("en-US",{month:"long"})} ${lastDate.getFullYear()}`
    :`${firstDate.toLocaleString("en-US",{month:"short"})} – ${lastDate.toLocaleString("en-US",{month:"short"})} ${lastDate.getFullYear()}`;

  return(
    <div>
      {/* Month label */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:T.txt,fontFamily:"Manrope"}}>{monthLabel}</div>

      </div>

      {/* Day-of-week headers */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {dayHeaders.map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:T.muted,letterSpacing:.5}}>{d}</div>
        ))}
      </div>

      {/* Calendar cells */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {cells.map((cell,i)=>{
          const day=cell.date.getDate();
          const isToday=!cell.isFuture&&cell.date.getDate()===todayD&&cell.date.getMonth()===todayM;
          const lvl=cell.isFuture?-1:getLevel(i);
          const bg=cell.isFuture?"transparent":levelColors[lvl];
          const txt=cell.isFuture?T.muted:levelText[lvl];
          return(
            <div key={i} title={cell.isFuture?`${cell.date.toDateString()} — upcoming`:`${cell.date.toDateString()} — Level ${lvl}`}
              style={{aspectRatio:"1",borderRadius:6,background:bg,
                border:isToday?`2px solid ${T.p}`:cell.isFuture?`1px dashed ${T.bdr}`:"none",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:11,fontWeight:isToday?800:600,color:txt,
                fontFamily:"Manrope",transition:"all .2s"}}>
              {day}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:14,fontSize:11,color:T.muted}}>
        <span style={{display:"flex",alignItems:"center",gap:5}}>
          <div style={{width:8,height:8,borderRadius:2,border:`2px solid ${T.p}`}}/>Today
        </span>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span>Less</span>
          {levelColors.map((c,i)=><div key={i} style={{width:9,height:9,borderRadius:2,background:c}}/>)}
          <span>More</span>
        </div>
      </div>
    </div>
  );
}

}

/* ── Tab Row (with built-in FilterBar slot) ─────────────────────────────── */
function TabRow({tabs,active,onTab,filterProps}){
  const tabRef=useRef(null);
  const onKeyDown=e=>{
    const ids=tabs.map(t=>t.id);
    const cur=ids.indexOf(active);
    if(e.key==="ArrowRight"){e.preventDefault();onTab(ids[(cur+1)%ids.length]);}
    else if(e.key==="ArrowLeft"){e.preventDefault();onTab(ids[(cur-1+ids.length)%ids.length]);}
  };
  return(
    <div style={{borderBottom:`1.5px solid ${T.bdr}`,marginBottom:22}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:8}}>
        <div ref={tabRef} role="tablist" onKeyDown={onKeyDown}
          style={{display:"flex",gap:0,overflowX:"auto",WebkitOverflowScrolling:"touch",scrollbarWidth:"none"}}>
          {tabs.map(tab=>(
            <button key={tab.id} role="tab" aria-selected={active===tab.id} tabIndex={active===tab.id?0:-1}
              onClick={()=>onTab(tab.id)}
              style={{padding:"10px 16px",border:"none",borderBottom:`2.5px solid ${active===tab.id?T.p:"transparent"}`,
                marginBottom:-1.5,background:"none",cursor:"pointer",fontFamily:"inherit",
                fontSize:14,fontWeight:active===tab.id?600:400,
                color:active===tab.id?T.p:T.muted,
                display:"flex",alignItems:"center",gap:7,whiteSpace:"nowrap"}}>
              {tab.label}
              {tab.count!=null&&(
                <span aria-label={`${tab.count}`} style={{fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:99,
                  background:active===tab.id?T.p:T.bdr,
                  color:active===tab.id?"#fff":T.muted,minWidth:22,textAlign:"center"}}>
                  {tab.count}
                </span>
              )}
            </button>
          ))}
        </div>
        {filterProps&&(
          <div style={{paddingBottom:10}}>
          <FilterBar {...filterProps}/>
        </div>
      )}
      </div>
    </div>
  );
}

const UNIT_AUDIO={
  1:{title:"Arrays in Memory – Podcast",duration:1475,
     desc:"A deep dive into how arrays live in physical memory, cache-line performance, and the difference between stack and heap allocation.",
     chapters:[{t:0,l:"Introduction"},{t:180,l:"Contiguous memory model"},{t:480,l:"Cache locality"},{t:820,l:"Dynamic vs static arrays"},{t:1200,l:"String internals"}]},
  2:{title:"Linked Lists – Audio Summary",duration:1122,
     desc:"An overview of singly, doubly, and circular linked lists with walkthroughs of insertion and deletion operations.",
     chapters:[{t:0,l:"Why linked lists?"},{t:240,l:"Singly linked lists"},{t:540,l:"Doubly linked lists"},{t:820,l:"Circular linked lists"},{t:980,l:"Time complexity recap"}]},
  3:{title:"Tree Traversals – Audio Lesson",duration:1335,
     desc:"Step-by-step explanation of in-order, pre-order, and post-order traversals with worked examples on real trees.",
     chapters:[{t:0,l:"What is tree traversal?"},{t:260,l:"In-order traversal"},{t:540,l:"Pre-order traversal"},{t:820,l:"Post-order traversal"},{t:1100,l:"Level-order (BFS)"}]},
};
const UNIT_TEXT={
  1:{title:"Lecture Notes – Arrays & Strings",sections:[
    {h:"1. What is an Array?",body:"An array is a collection of elements stored in contiguous memory locations. Each element occupies a fixed amount of space and can be accessed in O(1) time using an index. Arrays are the simplest and most widely used data structure."},
    {h:"2. Static vs Dynamic Arrays",body:"A static array has a fixed size declared at compile time. A dynamic array (e.g., Python list, Java ArrayList) grows by allocating a larger block when capacity is exceeded, copying elements over, and freeing the old block. Appending is amortised O(1)."},
    {h:"3. Key Operations & Complexity",body:"Access by index: O(1). Search (unsorted): O(n). Insert at end: O(1) amortised. Insert at position i: O(n) due to shifting. Delete at position i: O(n) due to shifting."},
    {h:"4. Two-Pointer Technique",body:"Maintaining two indices (left and right) that move toward each other is a common pattern for problems on sorted arrays. It converts O(n²) brute-force solutions to O(n). Classic examples: pair sum, container with most water, valid palindrome."},
    {h:"5. Strings in Memory",body:"In most languages strings are immutable sequences of characters. Concatenation in a loop is O(n²); use a builder/join for O(n). Common operations — reverse, rotate, anagram check, longest common prefix — are all solvable in O(n) or O(n log n)."},
  ]},
  2:{title:"Doubly & Circular Lists – Notes",sections:[
    {h:"1. Doubly Linked List",body:"Each node stores data, a pointer to the next node, and a pointer to the previous node. This allows O(1) bidirectional traversal and makes deletion of a given node easier — no need to track the predecessor."},
    {h:"2. Insertion & Deletion",body:"Insert after node X: create new node, set new.next = X.next, new.prev = X, X.next.prev = new, X.next = new. All O(1). Delete node X: X.prev.next = X.next; X.next.prev = X.prev. O(1) if you have the node reference."},
    {h:"3. Circular Linked List",body:"In a circular singly linked list the last node's next points back to the head. In a circular doubly linked list the head's prev also points to the tail. Useful for round-robin schedulers and buffered data streams."},
    {h:"4. Floyd's Cycle Detection",body:"Use two pointers — slow (moves 1 step) and fast (moves 2 steps). If there is a cycle they will meet. Once they meet, move one pointer to the head and step both one at a time — they meet at the cycle start. O(n) time, O(1) space."},
    {h:"5. Common Interview Problems",body:"1. Reverse a linked list iteratively and recursively\n2. Find the middle node (fast-slow pointers)\n3. Merge two sorted linked lists\n4. LRU Cache implementation (doubly linked list + hash map)"},
  ]},
  3:{title:"BST Properties & Graph Theory",sections:[
    {h:"1. Binary Search Tree Invariant",body:"For every node N: all values in the left subtree are less than N.value, and all values in the right subtree are greater. This invariant gives O(log n) average-case search, insert, and delete — O(n) worst case on a degenerate (skewed) tree."},
    {h:"2. BST Traversals",body:"In-order (L → N → R): produces sorted output.\nPre-order (N → L → R): used to serialise/clone the tree.\nPost-order (L → R → N): used for deletion and expression evaluation.\nLevel-order (BFS): processes nodes layer by layer."},
    {h:"3. Balanced BST",body:"AVL trees and Red-Black trees maintain O(log n) height through rotations after insertion/deletion. Most standard library maps/sets use a Red-Black tree. Height of a balanced BST with n nodes: floor(log₂ n)."},
    {h:"4. Graph Fundamentals",body:"A graph G = (V, E) consists of vertices V and edges E. Directed vs undirected, weighted vs unweighted. Representations: adjacency matrix O(V²) space; adjacency list O(V + E) space — preferred for sparse graphs."},
    {h:"5. Key Graph Algorithms",body:"BFS (Queue): shortest path in unweighted graphs, O(V + E).\nDFS (Stack/Recursion): detects cycles via back edges, topological sort, O(V + E).\nDijkstra: shortest path, non-negative weights, O((V + E) log V)."},
  ]},
};

/* ── Unit Quiz (fullscreen) ──────────────────────────────────────────────── */
function UnitQuizScreen({unitId,unitTitle,onFinish,onExit}){
  const mob=useIsMobile();
  const questions=UNIT_QUIZZES[unitId]||UNIT_QUIZZES[1];
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const q=questions[idx];
  const total=questions.length;
  const answered=Object.keys(answers).length;
  const isLast=idx===total-1;

  const handleSubmit=()=>{
    if(answered<total)return;
    setSubmitted(true);
  };

  if(submitted){
    const score=questions.filter((q2,i)=>answers[i]===q2.correct).length;
    return <QuizReportScreen questions={questions} answers={answers} score={score} unitTitle={unitTitle} onBack={onFinish} onRetry={()=>{setAnswers({});setIdx(0);setSubmitted(false);}}/>;
  }

  return(
    <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,display:"flex",flexDirection:"column",fontFamily:"'Sora',sans-serif"}}>
      {/* Header */}
      <div style={{background:T.sur,borderBottom:`1px solid ${T.bdr}`,padding:mob?"0 14px":"0 32px",height:mob?56:64,
        display:"flex",alignItems:"center",gap:mob?10:16,flexShrink:0}}>
        {/* Exit — tertiary */}
        <button onClick={onExit}
          style={{display:"flex",alignItems:"center",gap:6,padding:"8px 16px",
            border:`1.5px solid ${T.bdr}`,borderRadius:10,background:"transparent",
            color:T.muted,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>
          <Ic n="close" sz={16} color={T.muted}/>Exit quiz
        </button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontWeight:700,fontSize:15,color:T.txt,fontFamily:"Manrope"}}>{unitTitle}</div>
          <div style={{fontSize:12,color:T.muted}}>Unit Quiz · {total} Questions</div>
        </div>
        <div style={{fontSize:13,fontWeight:600,color:T.p,minWidth:80,textAlign:"right"}}>
          {answered}/{total} answered
        </div>
      </div>

      {/* Progress bar */}
      <div style={{height:4,background:T.bdr,flexShrink:0}}>
        <div style={{height:"100%",width:`${((idx+1)/total)*100}%`,background:T.p,transition:"width .3s ease"}}/>
      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:"auto",display:"flex",justifyContent:"center",padding:mob?"20px 14px":"40px 24px"}}>
        <div style={{width:"100%",maxWidth:680}}>
          {/* Question counter */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
            <div style={{display:"flex",gap:6}}>
              {questions.map((_,i)=>(
                <button key={i} onClick={()=>setIdx(i)}
                  style={{width:mob?28:32,height:mob?28:32,borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:mob?11:12,
                    border:`2px solid ${i===idx?T.p:answers[i]!==undefined?T.ok:T.bdr}`,
                    background:i===idx?T.p:answers[i]!==undefined?T.okBg:"#fff",
                    color:i===idx?"#fff":answers[i]!==undefined?T.ok:T.muted}}>
                  {i+1}
                </button>
              ))}
            </div>
            <div style={{fontSize:13,color:T.muted}}>Question <strong style={{color:T.txt}}>{idx+1}</strong> of {total}</div>
          </div>

          {/* Question card */}
          <Card p="32px 36px" style={{marginBottom:24,boxShadow:"0 4px 24px rgba(107,47,167,.08)"}}>
            <div style={{fontSize:18,fontWeight:700,color:T.txt,fontFamily:"Manrope",lineHeight:1.6,marginBottom:28}}>{q.q}</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {q.opts.map((opt,i)=>{
                const sel=answers[idx]===i;
                return(
                  <div key={i} onClick={()=>setAnswers({...answers,[idx]:i})}
                    style={{padding:mob?"12px 14px":"14px 18px",border:`2px solid ${sel?T.p:T.bdr}`,borderRadius:12,
                      background:sel?T.pLt:"#fff",cursor:"pointer",display:"flex",gap:14,alignItems:"center",
                      transition:"all .12s"}}>
                    <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,display:"flex",
                      alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,
                      border:`2px solid ${sel?T.p:T.bdr}`,
                      background:sel?T.p:"#fff",color:sel?"#fff":T.muted}}>
                      {LETTERS[i]}
                    </div>
                    <span style={{fontSize:15,fontWeight:sel?600:400,color:sel?T.p:T.txt}}>{opt}</span>
                  </div>
                );
              })}
            </div>
          </Card>

          {/* Navigation */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <Btn variant="ghost" onClick={()=>setIdx(Math.max(0,idx-1))} disabled={idx===0}>
              <Ic n="arrow_back" sz={15} color={T.muted}/>Previous
            </Btn>
            {isLast
              ?<Btn onClick={handleSubmit} disabled={answered<total}
                  style={{padding:mob?"11px 24px":"11px 32px",fontSize:mob?14:15}}>
                  Submit Quiz<Ic n="check" sz={16} color="#fff"/>
                </Btn>
              :<Btn onClick={()=>setIdx(idx+1)}>
                  Next<Ic n="arrow_forward" sz={15} color="#fff"/>
                </Btn>}
          </div>
          {isLast&&answered<total&&(
            <div style={{textAlign:"center",marginTop:12,fontSize:13,color:T.warn,
              display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              <Ic n="warning" sz={14} color={T.warn}/>Answer all questions before submitting
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Quiz Report ─────────────────────────────────────────────────────────── */
function QuizReportScreen({questions,answers,score,unitTitle,onBack,onRetry}){
  const mob=useIsMobile();
  const total=questions.length;
  const pct=Math.round((score/total)*100);
  const scoreC=pct>=80?T.ok:pct>=60?T.warn:T.err;
  return(
    <div style={{position:"fixed",inset:0,background:T.bg,zIndex:200,display:"flex",flexDirection:"column",
      fontFamily:"'Sora',sans-serif",overflowY:"auto"}}>
      {/* Header */}
      <div style={{background:T.sur,borderBottom:`1px solid ${T.bdr}`,padding:mob?"0 14px":"0 32px",height:mob?56:64,
        display:"flex",alignItems:"center",gap:mob?10:16,flexShrink:0,position:"sticky",top:0,zIndex:10}}>
        <button onClick={onBack}
          style={{display:"flex",alignItems:"center",gap:6,padding:"8px 16px",
            border:`1.5px solid ${T.bdr}`,borderRadius:10,background:"transparent",
            color:T.muted,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>
          <Ic n="arrow_back" sz={16} color={T.muted}/>Back to Course
        </button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontWeight:700,fontSize:15,color:T.txt,fontFamily:"Manrope"}}>Quiz Report — {unitTitle}</div>
        </div>
        <Btn variant="outlined" size="sm" onClick={onRetry}>
          <Ic n="replay" sz={15} color={T.p}/>Retry Quiz
        </Btn>
      </div>

      <div style={{maxWidth:720,margin:"0 auto",width:"100%",padding:mob?"20px 14px":"36px 24px"}}>
        {/* Score banner */}
        <Card p="28px 32px" style={{marginBottom:28,background:`linear-gradient(130deg,${T.pDk},${T.pMd})`,border:"none",textAlign:"center"}}>
          <div style={{fontSize:mob?40:56,fontWeight:800,color:"#fff",fontFamily:"Manrope",lineHeight:1,marginBottom:6}}>
            {score}<span style={{fontSize:mob?18:24}}>/{total}</span>
          </div>
          <div style={{fontSize:mob?22:28,fontWeight:700,color:"rgba(255,255,255,.85)",fontFamily:"Manrope",marginBottom:16}}>{pct}%</div>
          <div style={{display:"flex",justifyContent:"center",gap:24}}>
            {[["check_circle",`${score} Correct`,T.ok],["cancel",`${total-score} Wrong`,T.err],["percent","Accuracy",null]].map(([ic,lbl,c],i)=>(
              <div key={i} style={{background:"rgba(255,255,255,.15)",borderRadius:10,padding:mob?"8px 12px":"10px 18px",minWidth:90}}>
                <Ic n={ic} sz={18} color={c||"rgba(255,255,255,.8)"} fill={1} style={{margin:"0 auto 4px",display:"flex",justifyContent:"center"}}/>
                <div style={{fontSize:13,color:"rgba(255,255,255,.9)",fontWeight:600}}>{i===2?`${pct}%`:lbl}</div>
                {i===2&&<div style={{fontSize:11,color:"rgba(255,255,255,.82)"}}>Accuracy</div>}
              </div>
            ))}
          </div>
          {pct>=80&&<div style={{marginTop:16,fontSize:14,color:"rgba(255,255,255,.85)"}}>🎉 Excellent work! You've mastered this unit.</div>}
          {pct>=60&&pct<80&&<div style={{marginTop:16,fontSize:14,color:"rgba(255,255,255,.85)"}}>Good effort! Review the missed questions below.</div>}
          {pct<60&&<div style={{marginTop:16,fontSize:14,color:"rgba(255,255,255,.85)"}}>Keep going — review the explanations and retry the quiz.</div>}
        </Card>

        {/* Per-question breakdown */}
        <div style={{fontSize:13,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.7,marginBottom:14}}>Question Review</div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {questions.map((q2,i)=>{
            const userAns=answers[i];
            const correct=q2.correct;
            const isRight=userAns===correct;
            const skipped=userAns===undefined;
            return(
              <Card key={i} p="20px 24px" style={{border:`1.5px solid ${isRight?T.ok+"55":T.err+"55"}`,background:isRight?T.okBg+"44":T.errBg+"44"}}>

                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.6,marginBottom:4}}>
                      Question {i+1} · {isRight?"Correct":skipped?"Skipped":"Incorrect"}
                    </div>
                    <div style={{fontSize:14,fontWeight:600,color:T.txt,lineHeight:1.6}}>{q2.q}</div>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
                  {q2.opts.map((opt,j)=>{
                    const isCorrectOpt=j===correct;
                    const isUserOpt=j===userAns;
                    const show=isCorrectOpt||isUserOpt;
                    if(!show)return null;
                    return(
                      <div key={j} style={{padding:"10px 14px",borderRadius:10,display:"flex",alignItems:"center",gap:10,
                        border:`1.5px solid ${isCorrectOpt?T.ok:T.err}`,
                        background:isCorrectOpt?T.okBg:T.errBg}}>
                        <div style={{width:26,height:26,borderRadius:"50%",flexShrink:0,
                          background:isCorrectOpt?T.ok:T.err,display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:12,fontWeight:700,color:"#fff"}}>
                          {LETTERS[j]}
                        </div>
                        <span style={{fontSize:13,fontWeight:600,color:isCorrectOpt?T.ok:T.err,flex:1}}>{opt}</span>
                        <Badge color={isCorrectOpt?T.ok:T.err} bg={isCorrectOpt?T.okBg:T.errBg}>
                          {isCorrectOpt?"✓ Correct answer":isUserOpt&&!isCorrectOpt?"✗ Your answer":""}
                        </Badge>
                      </div>
                    );
                  })}
                </div>
                {/* Explanation */}
                <div style={{padding:"12px 14px",background:"rgba(107,47,167,.06)",borderRadius:10,
                  border:`1px solid ${T.p}22`,display:"flex",gap:10,alignItems:"flex-start"}}>

                  <div style={{fontSize:13,color:T.txt,lineHeight:1.65}}>{q2.exp}</div>
                </div>
              </Card>
            );
          })}
        </div>

        {/* Bottom actions */}
        <div style={{display:"flex",gap:12,marginTop:28,justifyContent:"center"}}>
          <Btn variant="outlined" onClick={onRetry}><Ic n="replay" sz={15} color={T.p}/>Retry Quiz</Btn>
          <Btn onClick={onBack}><Ic n="arrow_back" sz={15} color="#fff"/>Back to Course</Btn>
        </div>
      </div>
    </div>
  );
}

/* ── AI Practice Setup ───────────────────────────────────────────────────── */
function PracticeSetupScreen({onBack,onGenerate,mob}){
  const [saved,setSaved]=useState(()=>{try{return window.__ednara_practice_prefs||null;}catch(e){return null;}});
  const initial=saved||DEFAULT_PRACTICE_SETTINGS;
  const [subj,setSubj]=useState("");
  const [unit,setUnit]=useState("");
  const [total,setTotal]=useState(initial.qCount||10);
  const [types,setTypes]=useState(initial.types||["mcq"]);
  const [dist,setDist]=useState(initial.dist||null); // {mcq:5,tf:3,...}
  const [duration,setDuration]=useState(initial.duration||15);
  const [remember,setRemember]=useState(false);
  const [showTip,setShowTip]=useState(false);
  const [toast,setToast]=useState("");

  // Auto-distribute total across selected types whenever total or types change
  useEffect(()=>{
    if(types.length===0){setDist({});return;}
    const base=Math.floor(total/types.length);
    const rem=total-base*types.length;
    const next={};
    types.forEach((t,i)=>{next[t]=base+(i<rem?1:0);});
    setDist(next);
  // eslint-disable-next-line
  },[total,types.join(",")]);

  const distSum=Object.entries(dist||{}).filter(([k])=>types.includes(k)).reduce((a,[,v])=>a+(v||0),0);
  const distValid=distSum===total;
  const canGenerate=subj&&unit&&types.length>0&&total>=5&&total<=50&&duration>0&&duration<=60&&distValid;

  const toggleType=(id)=>{
    setTypes(prev=>{
      const next=prev.includes(id)?prev.filter(t=>t!==id):[...prev,id];
      return next.length===0?prev:next; // never allow zero
    });
  };
  const setTypeCount=(id,val)=>{
    const v=Math.max(0,parseInt(val)||0);
    setDist(prev=>({...prev,[id]:v}));
  };

  const handleGenerate=()=>{
    if(!canGenerate)return;
    if(remember){
      const prefs={qCount:total,types,dist,duration};
      window.__ednara_practice_prefs=prefs;
      setSaved(prefs);
    }
    onGenerate({title:`${subj} · ${unit}`,color:T.p,total,subject:subj,unit,types,dist,duration});
  };

  const resetSaved=()=>{
    try{delete window.__ednara_practice_prefs;}catch(e){}
    setSaved(null);
    setTotal(DEFAULT_PRACTICE_SETTINGS.qCount);
    setTypes(DEFAULT_PRACTICE_SETTINGS.types);
    setDuration(DEFAULT_PRACTICE_SETTINGS.duration);
    setToast("Saved settings cleared");
    setTimeout(()=>setToast(""),2500);
