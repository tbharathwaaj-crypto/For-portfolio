                  <span style={{fontSize:12,fontWeight:800,color:T.p,fontFamily:"Manrope"}}>3</span>
                </div>
                <div style={{fontWeight:700,fontSize:14,color:T.txt,fontFamily:"Manrope"}}>Total Questions</div>
              </div>
              <span style={{fontSize:22,fontWeight:800,color:T.p,fontFamily:"Manrope"}}>{total}</span>
            </div>
            <input type="range" min="5" max="50" step="1" value={total} onChange={e=>setTotal(parseInt(e.target.value))}
              style={{width:"100%",accentColor:T.p,cursor:"pointer"}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:T.muted,marginTop:4}}>
              <span>Min 5</span><span>Max 50</span>
            </div>
          </Card>

          {/* 4. Question types + distribution */}
          <Card>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{width:26,height:26,borderRadius:8,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <span style={{fontSize:12,fontWeight:800,color:T.p,fontFamily:"Manrope"}}>4</span>
              </div>
              <div style={{fontWeight:700,fontSize:14,color:T.txt,fontFamily:"Manrope"}}>Question Types & Distribution <span style={{color:T.err}}>*</span></div>
            </div>
            <div style={{fontSize:12,color:T.muted,marginBottom:12}}>Select which types to include. Total across all types must equal {total}.</div>
            <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr",gap:10,marginBottom:14}}>
              {PRACTICE_TYPES.map(t=>{
                const active=types.includes(t.id);
                const count=dist?.[t.id]||0;
                return(
                  <div key={t.id} style={{padding:"12px 14px",borderRadius:10,
                    border:`1.5px solid ${active?t.c:T.bdr}`,
                    background:active?t.c+"0D":T.sur,
                    transition:"all .12s"}}>
                    <button onClick={()=>toggleType(t.id)} aria-pressed={active}
                      style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",marginBottom:active?10:0,
                        background:"none",border:"none",padding:0,width:"100%",fontFamily:"inherit",textAlign:"left"}}>
                      <div style={{width:20,height:20,borderRadius:6,flexShrink:0,
                        border:`2px solid ${active?t.c:T.bdr}`,background:active?t.c:T.sur,
                        display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {active&&<Ic n="check" sz={13} color="#fff"/>}
                      </div>
                      <div style={{width:26,height:26,borderRadius:8,background:active?t.c+"22":T.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <Ic n={t.ic} sz={15} color={active?t.c:T.muted} fill={1}/>
                      </div>
                      <span style={{fontSize:13,fontWeight:600,color:active?t.c:T.muted,flex:1}}>{t.label}</span>
                    </button>
                    {active&&(
                      <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:30}}>
                        <Stepper value={count} min={0} max={total} color={t.c} ariaLabel={`${t.label} questions`}
                          onChange={v=>setTypeCount(t.id,v)}/>
                        <span style={{fontSize:11,color:T.muted,marginLeft:"auto"}}>questions</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {/* Distribution summary */}
            <div role="status" aria-live="polite" style={{padding:"10px 14px",borderRadius:10,
              background:distValid?T.okBg:T.errBg,
              border:`1.5px solid ${distValid?T.ok+"55":T.err+"55"}`,
              display:"flex",alignItems:"center",gap:9}}>
              <Ic n={distValid?"check_circle":"error"} sz={16} color={distValid?T.ok:T.err} fill={1}/>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:distValid?T.ok:T.err}}>
                {distValid
                  ?`Sum matches: ${distSum} of ${total} questions`
                  :`Sum is ${distSum}, needs to be ${total} (${distSum>total?`remove ${distSum-total}`:`add ${total-distSum}`})`}
              </div>
            </div>
          </Card>

          {/* 5. Duration */}
          <Card>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:26,height:26,borderRadius:8,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:12,fontWeight:800,color:T.p,fontFamily:"Manrope"}}>5</span>
                </div>
                <div style={{fontWeight:700,fontSize:14,color:T.txt,fontFamily:"Manrope"}}>Duration</div>
              </div>
              <span style={{fontSize:22,fontWeight:800,color:T.p,fontFamily:"Manrope"}}>{duration} min</span>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              {[5,10,15,20,30,45,60].map(m=>(
                <button key={m} onClick={()=>setDuration(m)}
                  style={{padding:"6px 14px",borderRadius:99,border:`1.5px solid ${duration===m?T.p:T.bdr}`,
                    background:duration===m?T.pLt:T.sur,color:duration===m?T.p:T.muted,
                    fontWeight:duration===m?700:500,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                  {m}m
                </button>
              ))}
            </div>
            <input type="range" min="1" max="60" step="1" value={duration} onChange={e=>setDuration(parseInt(e.target.value))}
              style={{width:"100%",accentColor:T.p,cursor:"pointer"}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:T.muted,marginTop:4}}>
              <span>1 min</span><span>Max 60 min</span>
            </div>
          </Card>

          {/* Save settings */}
          <Card p="14px 18px">
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <Checkbox checked={remember} onChange={v=>setRemember(v)} size={20}/>
              <div style={{flex:1,minWidth:0}}>
                <div onClick={()=>setRemember(!remember)} style={{fontSize:13,fontWeight:600,color:T.txt,cursor:"pointer",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  Remember these settings for this session
                  <span onClick={e=>{e.stopPropagation();setShowTip(!showTip);}} style={{position:"relative",display:"inline-flex",cursor:"pointer"}}>
                    <Ic n="info" sz={14} color={T.muted}/>
                    {showTip&&(
                      <span onClick={e=>e.stopPropagation()} style={{position:"absolute",bottom:22,left:-8,zIndex:10,
                        background:T.txt,color:"#fff",padding:"10px 12px",borderRadius:8,fontSize:11,
                        fontWeight:400,lineHeight:1.5,width:mob?220:280,boxShadow:"0 8px 24px rgba(0,0,0,.25)"}}>
                        Save your preferred practice settings. Next time, you'll only need to select the Subject and Unit. The total questions, question distribution, question types, and duration will be pre-filled automatically.
                      </span>
                    )}
                  </span>
                </div>
                {saved&&(
                  <button onClick={resetSaved} style={{background:"none",border:"none",padding:0,marginTop:6,
                    color:T.err,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",
                    display:"flex",alignItems:"center",gap:4}}>
                    <Ic n="delete_outline" sz={13} color={T.err}/>Reset saved settings
                  </button>
                )}
              </div>
            </div>
          </Card>
        </div>

        {/* Summary sidebar */}
        <div style={{position:mob?"static":"sticky",top:20,display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <Ic n="preview" sz={18} color={T.p} fill={1}/>
              <div style={{fontWeight:700,fontSize:14,color:T.txt,fontFamily:"Manrope"}}>Practice Preview</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[
                ["Subject",subj||"Not selected",subj?T.txt:T.muted],
                ["Unit",unit||"Not selected",unit?T.txt:T.muted],
                ["Total questions",`${total}`,T.p],
                ["Types",types.length?`${types.length} selected`:"None",types.length?T.txt:T.muted],
                ["Duration",`${duration} min`,T.p],
              ].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,gap:8}}>
                  <span style={{color:T.muted}}>{l}</span>
                  <span style={{fontWeight:700,color:c,textAlign:"right"}}>{v}</span>
                </div>
              ))}
            </div>
            {types.length>0&&dist&&(
              <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${T.bdr}`}}>
                <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Distribution</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {PRACTICE_TYPES.filter(t=>types.includes(t.id)).map(t=>{
                    const c=dist[t.id]||0;
                    const pct=total?Math.round((c/total)*100):0;
                    return(
                      <div key={t.id}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                          <span style={{color:t.c,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
                            <Ic n={t.ic} sz={12} color={t.c} fill={1}/>{t.label}
                          </span>
                          <span style={{color:t.c,fontWeight:700}}>{c}</span>
                        </div>
                        <div style={{height:4,background:T.bdr,borderRadius:99,overflow:"hidden"}}>
                          <div style={{width:`${pct}%`,height:"100%",background:t.c,transition:"width .25s"}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </Card>
          <Btn full onClick={handleGenerate} disabled={!canGenerate}
            style={{boxShadow:canGenerate?`0 4px 14px ${T.p}44`:"none",padding:"12px 24px",justifyContent:"center"}}>
            <Ic n="auto_awesome" sz={16} color="#fff" fill={1}/>Generate Practice
          </Btn>
          {!canGenerate&&(
            <div style={{fontSize:11,color:T.muted,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
              <Ic n="info" sz={12} color={T.muted}/>
              {!subj?"Select a subject":!unit?"Select a unit":types.length===0?"Choose at least one question type":!distValid?"Fix the distribution":"Complete all fields"}
            </div>
          )}
        </div>
      </div>
      {/* Toast */}
      {toast&&(
        <div role="status" style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:100000,
          background:T.txt,color:"#fff",padding:"10px 20px",borderRadius:10,fontSize:13,
          fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.3)",display:"flex",alignItems:"center",gap:8}}>
          <Ic n="check_circle" sz={16} color="#fff" fill={1}/>{toast}
        </div>
      )}
    </div>
  );
}

/* ── Practice Session ────────────────────────────────────────────────────── */
function PracticeSessionScreen({subject,onBack,mob,exp}){
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);         // MCQ selected option index
  const [tfSel,setTfSel]=useState(null);     // TF: true/false
  const [matchSel,setMatchSel]=useState([]); // Match: array of right indices
  const [shortText,setShortText]=useState("");// Short answer text
  const [submitted,setSubmitted]=useState(false);
  const [score,setScore]=useState(0);
  const [wrongSet,setWrongSet]=useState(new Set());
  const [rightSet,setRightSet]=useState(new Set());
  const [skippedSet,setSkippedSet]=useState(new Set());
  const [answers,setAnswers]=useState({});  // {qIdx:{type,value}} — persisted per question
  const [reportOpen,setReportOpen]=useState(false);
  const [done,setDone]=useState(false);
  const [secs,setSecs]=useState(0);
  const s=subject||PS_AV[0];
  const q=PQ[idx];
  useEffect(()=>{const t=setInterval(()=>setSecs(x=>x+1),1000);return()=>clearInterval(t);},[]);
  const fmt=t=>`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;

  const canSubmit=()=>{
    if(!q) return false;
    if(q.type==="mcq")   return sel!==null;
    if(q.type==="tf")    return tfSel!==null;
    if(q.type==="match") return matchSel.length===q.left.length&&matchSel.every(x=>x!==undefined);
    if(q.type==="short") return(shortText||"").trim().length>=(q.minChars||1);
    return false;
  };

  const checkCorrect=()=>{
    if(q.type==="mcq")   return sel===q.correct;
    if(q.type==="tf")    return tfSel===q.answer;
    if(q.type==="match") return q.correct.every((c,i)=>matchSel[i]===c);
    if(q.type==="short") return true; // short answers are always "accepted"
    return false;
  };

  const submit=()=>{
    if(!canSubmit())return;
    setSubmitted(true);
    setSkippedSet(prev=>{const n=new Set(prev);n.delete(idx);return n;});
    const value=q.type==="mcq"?sel:q.type==="tf"?tfSel:q.type==="match"?[...matchSel]:shortText;
    setAnswers(prev=>({...prev,[idx]:{type:q.type,value}}));
    const correct=checkCorrect();
    if(correct){
      setScore(x=>x+1);
      setRightSet(prev=>new Set(prev).add(idx));
    }else{
      setWrongSet(prev=>new Set(prev).add(idx));
    }
  };

  const next=()=>{
    if(idx===PQ.length-1){setDone(true);return;}
    setIdx(i=>i+1);setSel(null);setTfSel(null);setMatchSel([]);setShortText("");setSubmitted(false);
  };

  const skip=()=>{
    setSkippedSet(prev=>new Set(prev).add(idx));
    setWrongSet(prev=>{const n=new Set(prev);n.delete(idx);return n;});
    setRightSet(prev=>{const n=new Set(prev);n.delete(idx);return n;});
    if(idx===PQ.length-1){setDone(true);return;}
    setIdx(i=>i+1);setSel(null);setTfSel(null);setMatchSel([]);setShortText("");setSubmitted(false);
  };

  // Formatter for a stored answer (or the "skipped" state)
  const formatAnswer=(qq,rec)=>{
    if(!rec)return null;
    if(qq.type==="mcq")   return rec.value!=null&&qq.opts?qq.opts[rec.value]:"—";
    if(qq.type==="tf")    return rec.value===true?"True":rec.value===false?"False":"—";
    if(qq.type==="short") return(rec.value||"").trim()||"—";
    if(qq.type==="match"){
      if(!Array.isArray(rec.value))return "—";
      return qq.left.map((l,i)=>`${l} → ${qq.right[rec.value[i]]||"—"}`).join("; ");
    }
    return "—";
  };
  const formatCorrect=(qq)=>{
    if(qq.type==="mcq")   return qq.opts[qq.correct];
    if(qq.type==="tf")    return qq.answer?"True":"False";
    if(qq.type==="short") return qq.modelAnswer||"See explanation for a model answer.";
    if(qq.type==="match") return qq.left.map((l,i)=>`${l} → ${qq.right[qq.correct[i]]}`).join("; ");
    return "";
  };
  const typeMeta={
    mcq:{ic:"radio_button_checked",label:"MCQ",c:"#2563EB"},
    tf:{ic:"toggle_on",label:"True / False",c:"#059669"},
    short:{ic:"short_text",label:"Short Answer",c:"#0891B2"},
    match:{ic:"swap_horiz",label:"Match",c:"#D97706"},
  };

  if(done){
    const pct=Math.round((score/PQ.length)*100);

    return(
        <div className="fu" style={{padding:mob?"16px":"24px 28px",maxWidth:820,margin:"0 auto"}}>
          {/* Report header */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.6}}>Practice Report</div>
              <div style={{fontSize:mob?18:22,fontWeight:800,color:T.txt,fontFamily:"Manrope"}}>{s.title}</div>
            </div>
            <Btn variant="ghost" size="sm" onClick={onBack}>
              <Ic n="home" sz={15} color={T.muted}/>Back to home
            </Btn>
          </div>
          {/* Summary strip */}
          <Card p={mob?"14px 16px":"16px 20px"} style={{marginBottom:18,background:`linear-gradient(130deg,${T.pLt},#EDE5F8)`,border:`1px solid ${T.p}22`}}>
            <div style={{display:"grid",gridTemplateColumns:mob?"repeat(2,1fr)":"repeat(4,1fr)",gap:mob?12:16}}>
              {[
                ["Correct",rightSet.size,T.ok,"check_circle"],
                ["Wrong",wrongSet.size,T.err,"cancel"],
                ["Skipped",skippedSet.size,T.muted,"redo"],
                ["Accuracy",`${pct}%`,T.p,"target"],
              ].map(([l,v,c,ic])=>(
                <div key={l} style={{display:"flex",gap:10,alignItems:"center"}}>
                  <div style={{width:36,height:36,borderRadius:10,background:c+"22",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <Ic n={ic} sz={18} color={c} fill={1}/>
                  </div>
                  <div>
                    <div style={{fontSize:18,fontWeight:800,color:T.txt,fontFamily:"Manrope",lineHeight:1}}>{v}</div>
                    <div style={{fontSize:11,color:T.muted,marginTop:3}}>{l}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {/* Question-by-question breakdown */}
          <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:20}}>
            {PQ.map((qq,i)=>{
              const rec=answers[i];
              const isRight=rightSet.has(i);
              const isWrong=wrongSet.has(i);
              const isSkip=skippedSet.has(i);
              const isShort=qq.type==="short";
              // Status color/label
              const statusCfg=isRight?{c:T.ok,bg:T.okBg,ic:"check_circle",label:"Correct"}
                :isWrong?{c:T.err,bg:T.errBg,ic:"cancel",label:"Wrong"}
                :isSkip?{c:T.muted,bg:T.bg,ic:"redo",label:"Skipped"}
                :{c:T.muted,bg:T.bg,ic:"help",label:"Not attempted"};
              const tm=typeMeta[qq.type]||typeMeta.mcq;
              return(
                <Card key={i} p={mob?"14px":"18px 20px"} >
                  {/* Header row */}
                  <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:12,flexWrap:"wrap"}}>
                    <div style={{width:32,height:32,borderRadius:8,background:statusCfg.c,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <Ic n={statusCfg.ic} sz={17} color="#fff" fill={1}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5}}>Q{i+1}</span>
                        <span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:99,background:tm.c+"18",color:tm.c,display:"inline-flex",alignItems:"center",gap:4}}>
                          <Ic n={tm.ic} sz={11} color={tm.c} fill={1}/>{tm.label}
                        </span>
                        <span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:99,background:statusCfg.bg,color:statusCfg.c}}>{statusCfg.label}</span>
                      </div>
                      <div style={{fontSize:mob?14:15,fontWeight:600,color:T.txt,lineHeight:1.55,fontFamily:"Manrope"}}>{qq.q}</div>
                      {qq.img&&<div style={{marginTop:12}}><QuestionDiagram kind={qq.img} alt={qq.imgAlt}/></div>}
                    </div>
                  </div>

                  {/* Answers grid */}
                  <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr",gap:10,marginBottom:12}}>
                    <div style={{background:isRight?T.okBg:isWrong?T.errBg:T.bg,borderRadius:9,padding:"10px 12px",
                      border:`1px solid ${isRight?T.ok+"44":isWrong?T.err+"44":T.bdr}`}}>
                      <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>
                        <Ic n="person" sz={12} color={T.muted}/>Your answer
                      </div>
                      <div style={{fontSize:13,color:isSkip?T.muted:T.txt,fontStyle:isSkip?"italic":"normal",lineHeight:1.55,fontWeight:isShort?500:600}}>
                        {isSkip?"You skipped this question":formatAnswer(qq,rec)||"Not attempted"}
                      </div>
                    </div>
                    <div style={{background:T.okBg,borderRadius:9,padding:"10px 12px",border:`1px solid ${T.ok}44`}}>
                      <div style={{fontSize:11,fontWeight:700,color:T.ok,textTransform:"uppercase",letterSpacing:.5,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>
                        <Ic n="verified" sz={12} color={T.ok} fill={1}/>Correct answer
                      </div>
                      <div style={{fontSize:13,color:T.txt,lineHeight:1.55,fontWeight:600}}>{formatCorrect(qq)}</div>
                    </div>
                  </div>

                  {/* Explanation — always shown */}
                  {qq.exp&&(
                    <div style={{background:T.pLt,borderRadius:9,padding:"10px 12px",border:`1px solid ${T.p}22`,
                      display:"flex",gap:9,alignItems:"flex-start"}}>
                      <Ic n="auto_awesome" sz={15} color={T.p} fill={1}/>
                      <div>
                        <div style={{fontSize:11,fontWeight:700,color:T.p,textTransform:"uppercase",letterSpacing:.5,marginBottom:3}}>Explanation</div>
                        <div style={{fontSize:13,color:T.txt,lineHeight:1.65}}>{qq.exp}</div>
                      </div>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
          {/* Footer actions */}
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <Btn variant="ghost" onClick={onBack}>Back to practice</Btn>
            <Btn onClick={()=>{setIdx(0);setSel(null);setTfSel(null);setMatchSel([]);setShortText("");setSubmitted(false);setScore(0);setDone(false);setSecs(0);setWrongSet(new Set());setRightSet(new Set());setSkippedSet(new Set());setAnswers({});}}>
              <Ic n="restart_alt" sz={15} color="#fff"/>Practice again
            </Btn>
          </div>
        </div>
      );
  }

  const tc=TYPE_COLORS[q.type||"mcq"]||[T.p,T.pLt];
  const isCorrect=submitted&&checkCorrect();
  const isWrong=submitted&&!checkCorrect();

  return(
    <>
    <div className="fu" style={{padding:mob?"16px 16px 96px":"22px 28px 96px"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.muted,
            fontFamily:"inherit",fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:4}}>
            <Ic n="arrow_back" sz={16} color={T.muted}/>Exit
          </button>
          <Divider vertical/>
          <span style={{fontWeight:700,fontSize:mob?13:15,color:T.txt,fontFamily:"Manrope"}}>{s.title}</span>
        </div>
        <div style={{display:"flex",gap:mob?6:12,alignItems:"center"}}>
          <div style={{background:T.pLt,border:`1px solid ${T.p}33`,borderRadius:10,padding:"6px 14px",
            fontSize:14,fontWeight:700,color:T.p,display:"flex",alignItems:"center",gap:6}}>
            <Ic n="bolt" sz={16} color={T.p} fill={1}/>+{score*10} XP
          </div>
          <div style={{background:T.pLt,border:`1px solid ${T.p}33`,borderRadius:10,padding:"6px 14px",
            fontSize:14,fontWeight:700,color:T.p,display:"flex",alignItems:"center",gap:6}}>
            <Ic n="timer" sz={16} color={T.p}/>{fmt(secs)}
          </div>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 264px",gap:mob?14:18}}>
        <Card>
          <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
            <Badge color={T.p}>Question {idx+1} / {PQ.length}</Badge>
            <Badge color={tc[0]} bg={tc[1]}>
              <Ic n={q.type==="mcq"?"radio_button_checked":q.type==="tf"?"toggle_on":q.type==="short"?"short_text":"swap_horiz"} sz={13} color={tc[0]} fill={1}/>
              {TYPE_LABELS[q.type||"mcq"]||"MCQ"}
            </Badge>
          </div>
          <div style={{fontSize:mob?15:16,fontWeight:600,color:T.txt,lineHeight:1.65,marginBottom:q.img?14:22,fontFamily:"Manrope"}}>{q.q}</div>
          {q.img&&<QuestionDiagram kind={q.img} alt={q.imgAlt}/>}

          {/* ── MCQ ── */}
          {q.type==="mcq"&&(
            <div role="radiogroup" aria-label="Answer options" style={{display:"flex",flexDirection:"column",gap:10}}>
              {q.opts.map((opt,i)=>{
                const isCor=i===q.correct,isSel=i===sel;
                let border=T.bdr,bg="#fff",color=T.txt;
                if(submitted){if(isCor){border=T.ok;bg=T.okBg;color=T.ok;}else if(isSel&&!isCor){border=T.err;bg=T.errBg;color=T.err;}}
                else if(isSel){border=T.p;bg=T.pLt;color=T.p;}
                return(
                  <button key={i} role="radio" aria-checked={isSel} disabled={submitted} onClick={()=>!submitted&&setSel(i)}
                    style={{padding:"12px 14px",border:`2px solid ${border}`,borderRadius:12,background:bg,
                      cursor:submitted?"default":"pointer",display:"flex",gap:12,alignItems:"center",transition:"all .12s",
                      width:"100%",textAlign:"left",fontFamily:"inherit"}}>
                    <div style={{width:28,height:28,borderRadius:"50%",border:`2px solid ${border}`,
                      background:isSel||(submitted&&isCor)?border:"#fff",
                      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {isSel||(submitted&&isCor)
                        ?submitted&&isCor?<Ic n="check" sz={14} color="#fff"/>:<span style={{fontSize:12,fontWeight:700,color:"#fff"}}>{LETTERS[i]}</span>
                        :<span style={{fontSize:12,fontWeight:700,color:T.muted}}>{LETTERS[i]}</span>}
                    </div>
                    <span style={{fontSize:14,fontWeight:isSel?600:400,color}}>{opt}</span>
                    {submitted&&isCor&&<span style={{marginLeft:"auto",color:T.ok,fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:4}}><Ic n="check_circle" sz={15} color={T.ok} fill={1}/>Correct</span>}
                    {submitted&&isSel&&!isCor&&<span style={{marginLeft:"auto",color:T.err,fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:4}}><Ic n="cancel" sz={15} color={T.err} fill={1}/>Wrong</span>}
                  </button>
                );
              })}
            </div>
          )}

          {/* ── True / False ── */}
          {q.type==="tf"&&(
            <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
              {[true,false].map(val=>{
                const isSel=tfSel===val;
                const isCor=val===q.answer;
                let border=T.bdr,bg="#fff",col=T.muted;
                if(submitted){
                  if(isCor){border=T.ok;bg=T.okBg;col=T.ok;}
                  else if(isSel&&!isCor){border=T.err;bg=T.errBg;col=T.err;}
                }else if(isSel){border=T.p;bg=T.pLt;col=T.p;}
                return(
                  <button key={String(val)} role="radio" aria-checked={isSel} disabled={submitted} onClick={()=>!submitted&&setTfSel(val)}
                    style={{flex:1,minWidth:mob?100:140,padding:mob?"18px":"22px",borderRadius:14,
                      border:`2.5px solid ${border}`,background:bg,fontFamily:"inherit",
                      cursor:submitted?"default":"pointer",textAlign:"center",transition:"all .15s"}}>
                    <Ic n={val?"check_circle":"cancel"} sz={32} color={col} fill={isSel||isCor?1:0}/>
                    <div style={{fontWeight:700,fontSize:16,color:col,marginTop:6,fontFamily:"Manrope"}}>{val?"True":"False"}</div>
                    {submitted&&isCor&&<div style={{fontSize:11,color:T.ok,fontWeight:700,marginTop:4}}>✓ Correct</div>}
                    {submitted&&isSel&&!isCor&&<div style={{fontSize:11,color:T.err,fontWeight:700,marginTop:4}}>✗ Wrong</div>}
                  </button>
                );
              })}
            </div>
          )}

          {/* ── Short Answer ── */}
          {q.type==="short"&&(
            <div>
              <textarea value={shortText} onChange={e=>!submitted&&setShortText(e.target.value)}
                placeholder="Type your answer…" rows={3} disabled={submitted}
                style={{width:"100%",padding:"12px 14px",border:`2px solid ${submitted?(isCorrect?T.ok:T.p):shortText.trim().length>=(q.minChars||1)?T.ok:shortText.trim()?T.p:T.bdr}`,
                  borderRadius:12,fontSize:14,resize:"vertical",
                  fontFamily:"'Sora',sans-serif",lineHeight:1.75,color:T.txt,
                  background:submitted?"#FAFAFA":"#fff"}}/>
              {!submitted&&(
                <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
                  <div style={{fontSize:12,color:shortText.length>=(q.minChars||1)?T.ok:T.muted,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
                    {shortText.length>=(q.minChars||1)&&<Ic n="check_circle" sz={14} color={T.ok} fill={1}/>}
                    {shortText.length} / {q.minChars||30} min characters
                  </div>
                  <div style={{fontSize:11,color:T.muted}}>{shortText.trim().split(/\s+/).filter(Boolean).length} words</div>
                </div>
              )}
              {submitted&&q.modelAnswer&&(
                <div style={{marginTop:12,padding:"12px 14px",borderRadius:10,border:`1px solid ${T.ok}33`,background:T.okBg}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.ok,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>
                    <Ic n="check_circle" sz={14} color={T.ok} fill={1}/>Model Answer
                  </div>
                  <div style={{fontSize:13,color:T.txt,lineHeight:1.6}}>{q.modelAnswer}</div>
                </div>
              )}
            </div>
          )}

          {/* ── Match the Following ── */}
          {q.type==="match"&&(
            <div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {q.left.map((leftItem,li)=>{
                  const assigned=matchSel[li];
                  const isCor=submitted&&assigned===q.correct[li];
                  const isWr=submitted&&assigned!==undefined&&assigned!==q.correct[li];
                  let border=T.bdr,bg="#fff";
                  if(isCor){border=T.ok;bg=T.okBg;}
                  else if(isWr){border=T.err;bg=T.errBg;}
                  else if(assigned!==undefined&&!submitted){border=T.p;bg=T.pLt;}
                  return(
                    <div key={li} style={{display:"flex",alignItems:"center",gap:mob?8:14,flexWrap:mob?"wrap":"nowrap"}}>
                      <div style={{flex:1,padding:"10px 14px",borderRadius:10,background:T.pLt,
                        border:`1.5px solid ${T.p}33`,fontWeight:600,fontSize:14,color:T.pDk,minWidth:mob?100:140}}>
                        <span style={{fontWeight:700,color:T.p,marginRight:8}}>{LETTERS[li]}.</span>{leftItem}
                      </div>
                      <Ic n="arrow_forward" sz={18} color={isCor?T.ok:isWr?T.err:assigned!==undefined?T.p:T.bdr}/>
                      <div style={{flex:1,minWidth:mob?100:140}}>
                        <select value={assigned!==undefined?assigned:""} disabled={submitted}
                          onChange={e=>{const v=e.target.value;const next=[...matchSel];next[li]=v===""?undefined:parseInt(v);setMatchSel(next);}}
                          style={{width:"100%",padding:"10px 14px",borderRadius:10,fontSize:14,
                            border:`2px solid ${border}`,background:bg,
                            color:assigned!==undefined?(isCor?T.ok:isWr?T.err:T.p):T.muted,
                            fontWeight:assigned!==undefined?600:400,
                            cursor:submitted?"default":"pointer",fontFamily:"inherit",appearance:"none"}}>
                          <option value="">— Select —</option>
                          {q.right.map((r,ri)=><option key={ri} value={ri}>{ri+1}. {r}</option>)}
                        </select>
                      </div>
                      {isCor&&<Ic n="check_circle" sz={18} color={T.ok} fill={1}/>}
                      {isWr&&<Ic n="cancel" sz={18} color={T.err} fill={1}/>}
                    </div>
                  );
                })}
              </div>
              {submitted&&(
                <div style={{marginTop:10,fontSize:12,color:isCorrect?T.ok:T.err,fontWeight:700}}>
                  {isCorrect?"All matched correctly!":"Some matches are incorrect — see the explanation below."}
                </div>
              )}
            </div>
          )}

          {/* Explanation */}
          {submitted&&q.exp&&(
            <div style={{marginTop:16,padding:"14px 16px",background:T.pLt,borderRadius:12,
              border:`1px solid ${T.p}33`,animation:"fadeUp .2s ease"}}>
              <div style={{fontSize:13,fontWeight:700,color:T.p,marginBottom:5,display:"flex",alignItems:"center",gap:6}}>
                <Ic n="auto_awesome" sz={15} color={T.p} fill={1}/>Explanation
              </div>
              <div style={{fontSize:14,color:T.txt,lineHeight:1.7}}>{q.exp}</div>
            </div>
          )}

          {/* Actions — moved to fixed bottom bar */}
        </Card>

        {/* Side panel */}
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Card p="16px 18px">
            <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.6,marginBottom:12}}>Questions</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}} role="group" aria-label="Question navigator">
              {PQ.map((_,i)=>(
                <QPill key={i} n={i+1} size={mob?34:36}
                  active={i===idx}
                  state={rightSet.has(i)?"answered":wrongSet.has(i)?"wrong":skippedSet.has(i)?"skipped":"none"}
                  onClick={()=>{if(i<=idx){setIdx(i);setSel(null);setTfSel(null);setMatchSel([]);setShortText("");setSubmitted(false);}}}/>
              ))}
            </div>
          </Card>
        </div>
      </div>
    </div>
      {/* Fixed bottom action bar — rendered as a sibling of the animated (.fu) wrapper,
          NOT nested inside it. .fu ends its keyframe on transform:translateY(0), and since
          the animation has fill-mode:forwards that transform never clears — which makes .fu
          a new containing block for any position:fixed descendant. A fixed bar nested inside
          it would be pinned to .fu's box (offset by the sidebar + content padding) instead of
          the viewport, which is exactly what produced the left-hand gap. Keeping it a sibling
          means it's positioned relative to the true viewport with no gap. */}
      <div style={{position:"fixed",
        bottom:mob?"calc(56px + env(safe-area-inset-bottom,0px))":0,
        left:mob?0:(exp?224:68),right:0,zIndex:50,
        background:T.sur,borderTop:`1.5px solid ${T.bdr}`,
        padding:mob?"12px 16px":"14px 28px",
        boxShadow:"0 -4px 16px rgba(0,0,0,.06)",
        display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <button onClick={onBack}
          style={{padding:"10px 18px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
            background:T.sur,color:T.muted,
            cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
          <Ic n="arrow_back" sz={16} color={T.muted}/>Exit
        </button>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:12,color:T.muted,fontWeight:600,marginRight:4}}>{idx+1}/{PQ.length}</span>
          {!submitted&&(
            <button onClick={skip}
              style={{padding:"10px 18px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
                background:T.sur,color:T.muted,
                cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
              <Ic n="redo" sz={15} color={T.muted}/>Skip
            </button>
          )}
          {!submitted
            ?<Btn onClick={submit} disabled={!canSubmit()}>Submit answer</Btn>
            :<Btn onClick={next}>{idx===PQ.length-1?"Finish session":"Next question"}<Ic n="arrow_forward" sz={15} color="#fff"/></Btn>}
        </div>
      </div>
    </>
  );
}


/* ── Tests & Exams ───────────────────────────────────────────────────────── */
function TestsScreen({onStartExam,onViewReport,mob}){
  const [tab,setTab]=useState("scheduled");
  const [search,setSearch]=useState("");
  const [sub,setSub]=useState("");
  const [preExam,setPreExam]=useState(null); // the test being joined
  const [ackChecked,setAckChecked]=useState(false);
  const [camTested,setCamTested]=useState(false);
  const [micTested,setMicTested]=useState(false);
  const [camTesting,setCamTesting]=useState(false);
  const [micTesting,setMicTesting]=useState(false);
  const openPreExam=(t)=>{setPreExam(t);setAckChecked(false);setCamTested(false);setMicTested(false);setCamTesting(false);setMicTesting(false);};
  const runCamTest=()=>{setCamTesting(true);setTimeout(()=>{setCamTesting(false);setCamTested(true);},1400);};
  const runMicTest=()=>{setMicTesting(true);setTimeout(()=>{setMicTesting(false);setMicTested(true);},1400);};
  const live=TESTS.find(t=>t.status==="live");
  const TEST_SUBS=[...new Set(TESTS.map(t=>t.sub))];
  const filt=list=>list.filter(t=>
    (!search||t.title.toLowerCase().includes(search.toLowerCase())||t.sub.toLowerCase().includes(search.toLowerCase()))&&
    (!sub||t.sub===sub)
  );
  const TABS=[
    {id:"scheduled",label:"Scheduled", items:TESTS.filter(t=>t.status==="live"||t.status==="upcoming")},
    {id:"grading",  label:"In Grading",items:TESTS.filter(t=>t.status==="grading")},
    {id:"completed",label:"Completed", items:TESTS.filter(t=>t.status==="completed")},
  ];
  const current=TABS.find(t=>t.id===tab);

  const TestCard=({test})=>{
    const pct=test.score?Math.round((test.score/test.marks)*100):null;
    const scoreC=pct?pct>=75?T.ok:pct>=50?T.warn:T.err:null;
    return(
      <Card hoverable style={{cursor:"pointer",display:"flex",flexDirection:"column",padding:mob?"18px":"22px 24px"}}>
        {/* Row 1 — Subject tag (left) + Status (right) */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <Badge color="#4B5563" bg="#F3F4F6">{test.sub}</Badge>
          <div style={{flexShrink:0}}>
            {test.status==="live"&&<Badge color={T.p} bg={T.pLt}><Ic n="radio_button_checked" sz={11} color={T.p} fill={1}/>Live</Badge>}
            {test.status==="upcoming"&&<Badge color={T.p}>{test.date}</Badge>}
            {test.status==="grading"&&<Badge color={T.warn} bg={T.warnBg}><Ic n="pending" sz={11} color={T.warn}/>In Review</Badge>}
            {test.status==="completed"&&pct!=null&&<span style={{fontSize:mob?18:20,fontWeight:800,fontFamily:"Manrope",color:scoreC}}>{pct}%</span>}
          </div>
        </div>
        {/* Row 2 — Title */}
        <div style={{fontSize:mob?18:20,fontWeight:800,color:T.txt,fontFamily:"Manrope",lineHeight:1.3,marginBottom:12,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{test.title}</div>
        {/* Row 3 — Meta info inline */}
        <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:T.muted}}>
            <Ic n={test.status==="grading"?"calendar_today":"event"} sz={15} color={T.muted}/>
            {test.status==="grading"?`Submitted ${test.submittedOn}`:`${test.date} · ${test.time}`}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:T.muted}}>
            <Ic n="timer" sz={15} color={T.muted}/>{test.dur} min
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:T.muted}}>
            <Ic n="quiz" sz={15} color={T.muted}/>{test.qs} questions
          </div>
        </div>
        {/* Divider — pushed to bottom */}
        <div style={{height:1,background:T.bdr,marginBottom:16,marginTop:"auto"}}/>
        {/* Score — only for completed */}
        {test.status==="completed"&&(
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:13,color:T.muted,fontWeight:500}}>Score</span>
              <span style={{fontSize:14,fontWeight:800,color:scoreC,fontFamily:"Manrope"}}>{test.score}/{test.marks}</span>
            </div>
            <PBar value={pct} color={scoreC} h={6}/>
          </div>
        )}
        {/* Completed extra info */}
        {test.status==="completed"&&(
          <div style={{fontSize:12,fontWeight:600,color:T.ok,marginBottom:12,display:"flex",alignItems:"center",gap:5}}>
            <Ic n="check_circle" sz={13} color={T.ok} fill={1}/>{test.acc}% accuracy
            <span style={{color:T.muted,fontWeight:400}}>· Rank #{test.rank}</span>
          </div>
        )}
        {/* Action — secondary button, except live (priority) cards which stay primary */}
        <div>
          {test.status==="live"&&<Btn full onClick={()=>openPreExam(test)} style={{justifyContent:"center",gap:8,padding:"12px 24px",fontSize:14}}>Join now<Ic n="arrow_forward" sz={16} color="#fff"/></Btn>}
          {test.status==="completed"&&<Btn variant="outlined" full onClick={()=>onViewReport(test)} style={{justifyContent:"center",gap:8,padding:"12px 24px",fontSize:14}}>View Report<Ic n="arrow_forward" sz={16} color={T.p}/></Btn>}
          {test.status==="upcoming"&&<Btn variant="outlined" full onClick={()=>openPreExam(test)} style={{justifyContent:"center",gap:8,padding:"12px 24px",fontSize:14}}>View Details<Ic n="arrow_forward" sz={14} color={T.p}/></Btn>}
        </div>
      </Card>
    );
  };

  return(
    <>
    <div className="fu" style={{padding:mob?"16px":"24px 28px"}}>
      {live&&(
        <div style={{marginBottom:20,borderRadius:16,border:`2px solid ${T.p}44`,background:T.pLt,
          padding:"16px 20px",display:"flex",gap:16,alignItems:"center"}}>
          <div style={{width:48,height:48,borderRadius:13,background:T.p,display:"flex",
            alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Ic n="radio_button_checked" sz={24} color="#fff" fill={1}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,fontWeight:700,color:T.p,textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>Live Now · {live.time}</div>
            <div style={{fontSize:18,fontWeight:800,color:T.txt,fontFamily:"Manrope",marginBottom:2}}>{live.title}</div>
            <div style={{fontSize:13,color:T.muted}}>{live.sub} · {live.type} · {live.dur} min · {live.marks} marks</div>
          </div>
          <Btn onClick={()=>openPreExam(live)} style={{fontSize:15,padding:"11px 24px"}}>Join exam now <Ic n="arrow_forward" sz={16} color="#fff"/></Btn>
        </div>
      )}
      <TabRow
        tabs={TABS.map(t=>({...t,count:t.items.length}))}
        active={tab} onTab={t=>{setTab(t);setSearch("");setSub("");}}
        filterProps={{search,onSearch:setSearch,subject:sub,onSubject:setSub,subjects:TEST_SUBS,placeholder:"Search tests…"}}
      />
      {tab==="grading"&&(
        <div style={{background:T.warnBg,border:`1px solid ${T.warn}33`,borderRadius:12,padding:"11px 16px",
          marginBottom:16,display:"flex",alignItems:"center",gap:10,fontSize:13,color:"#92400E",fontWeight:500}}>
          <Ic n="info" sz={17} color={T.warn} fill={1}/>
          Submitted tests are being reviewed by your instructor. Results appear in <strong>Completed</strong> once graded.
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"repeat(3,minmax(0,1fr))",gap:mob?12:16}}>
        {filt(current.items).map(test=><TestCard key={test.id} test={test}/>)}
        {filt(current.items).length===0&&(
          <div style={{gridColumn:"1/-1",padding:"60px 0",textAlign:"center"}}>
            <Ic n="search_off" sz={48} color={T.muted}/>
            <div style={{fontSize:15,fontWeight:600,color:T.muted,marginTop:12}}>No tests match your filters</div>
            <Btn variant="tonal" size="sm" style={{marginTop:12}} onClick={()=>{setSearch("");setSub("");}}>Clear filters</Btn>
          </div>
        )}
      </div>
    </div>

      {/* Pre-exam instructions modal — full viewport overlay. Rendered as a sibling of
          .fu (not nested inside it) so its fixed backdrop covers the true viewport —
          see the practice-page CTA bar fix for why nesting inside .fu breaks this. */}
      {preExam&&(()=>{
        const canAck=camTested&&micTested;
        const canJoin=canAck&&ackChecked;
        return(
        <Modal open={!!preExam} onClose={()=>setPreExam(null)} closeOnBackdrop={false} labelledBy="preexam-title" maxWidth={560} mob={mob}>
            {/* Header — compact */}
            <div style={{padding:mob?"12px 16px":"14px 22px",borderBottom:`1px solid ${T.bdr}`,
              display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
              <div style={{width:34,height:34,borderRadius:10,background:T.pLt,display:"flex",
                alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Ic n="policy" sz={18} color={T.p} fill={1}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:mob?14:16,color:T.txt,fontFamily:"Manrope",lineHeight:1.2}}>Before You Begin</div>
                <div style={{fontSize:11,color:T.muted,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{preExam.title} · {preExam.dur} min · {preExam.marks} marks</div>
              </div>
              <button onClick={()=>setPreExam(null)} style={{background:"none",border:"none",cursor:"pointer",padding:4,flexShrink:0}}>
                <Ic n="close" sz={18} color={T.muted}/>
              </button>
            </div>
            <div style={{padding:mob?"12px 16px":"16px 22px",flex:1,minHeight:0,overflowY:"auto"}}>
              {/* Rules — full width */}
              <div>
                <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>Rules & Proctoring</div>
                <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr",gap:8}}>
                  {[
                    {ic:"warning",c:T.err,cbg:T.errBg,t:"Do not exit early",d:"Closing without submitting = fail."},
                    {ic:"videocam",c:T.p,cbg:T.pLt,t:"Camera stays on",d:"Webcam active for proctoring."},
                    {ic:"tab",c:T.warn,cbg:T.warnBg,t:"Tab switching monitored",d:"Repeated violations auto-submit."},
                    {ic:"timer",c:T.info,cbg:T.infoBg,t:"Timed test",d:`Auto-submits after ${preExam.dur} min.`},
                  ].map((r,i)=>(
                    <div key={i} style={{display:"flex",gap:9,alignItems:"flex-start"}}>
                      <div style={{width:26,height:26,borderRadius:8,background:r.cbg,display:"flex",
                        alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <Ic n={r.ic} sz={14} color={r.c} fill={1}/>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:700,color:T.txt,fontFamily:"Manrope",lineHeight:1.3}}>{r.t}</div>
                        <div style={{fontSize:11,color:T.muted,lineHeight:1.4,marginTop:1}}>{r.d}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              {/* Device Check — compact row underneath */}
              <div style={{marginTop:16}}>
                <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>Device Check</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {/* Camera */}
                  <div style={{background:"#1A1A2E",borderRadius:10,padding:"8px",
                    border:`1.5px solid ${camTested?T.ok:"transparent"}`,
                    display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:40,height:40,borderRadius:8,flexShrink:0,
                      background:camTesting?"#000":"rgba(255,255,255,.06)",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      position:"relative",overflow:"hidden"}}>
                      {camTesting?(<>
                        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at center,rgba(107,47,167,.35) 0%,rgba(0,0,0,.7) 70%)"}}/>
                        <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:T.p,animation:"scan 1.4s linear",boxShadow:`0 0 8px ${T.p}`}}/>
                      </>):camTested?(
                        <Ic n="face" sz={18} color="#fff"/>
                      ):(
                        <Ic n="videocam_off" sz={16} color="rgba(255,255,255,.7)"/>
                      )}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#fff",display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
                        Camera{camTested&&<Ic n="check_circle" sz={12} color={T.ok} fill={1}/>}
                      </div>
                      <button onClick={runCamTest} disabled={camTesting}
                        style={{width:"100%",padding:"5px 8px",borderRadius:7,border:"none",
                          background:camTested?"rgba(34,197,94,.15)":camTesting?"rgba(255,255,255,.1)":T.p,
                          color:camTested?T.ok:"#fff",fontWeight:700,fontSize:10.5,
                          cursor:camTesting?"default":"pointer",fontFamily:"inherit",
                          display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                        {camTesting?<><Ic n="refresh" sz={11} color="#fff"/>Testing…</>
                          :camTested?<><Ic n="check" sz={11} color={T.ok}/>Camera OK</>
                          :<>Test Camera</>}
                      </button>
                    </div>
                  </div>
                  {/* Microphone */}
                  <div style={{background:"#1A1A2E",borderRadius:10,padding:"8px",
                    border:`1.5px solid ${micTested?T.ok:"transparent"}`,
                    display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:40,height:40,borderRadius:8,flexShrink:0,
                      background:micTesting?"#000":"rgba(255,255,255,.06)",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:1.5,overflow:"hidden"}}>
                      {micTesting?(
                        [8,16,11,20,13].map((h,i)=>(
                          <div key={i} style={{width:2.5,height:`${h}px`,background:T.p,borderRadius:2,
                            animation:`bar ${.4+i*.04}s ease-in-out infinite alternate`}}/>
                        ))
                      ):micTested?(
                        <Ic n="graphic_eq" sz={18} color="#fff"/>
                      ):(
                        <Ic n="mic_off" sz={16} color="rgba(255,255,255,.7)"/>
                      )}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#fff",display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
                        Microphone{micTested&&<Ic n="check_circle" sz={12} color={T.ok} fill={1}/>}
                      </div>
                      <button onClick={runMicTest} disabled={micTesting}
                        style={{width:"100%",padding:"5px 8px",borderRadius:7,border:"none",
                          background:micTested?"rgba(34,197,94,.15)":micTesting?"rgba(255,255,255,.1)":T.p,
                          color:micTested?T.ok:"#fff",fontWeight:700,fontSize:10.5,
                          cursor:micTesting?"default":"pointer",fontFamily:"inherit",
                          display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                        {micTesting?<><Ic n="refresh" sz={11} color="#fff"/>Testing…</>
                          :micTested?<><Ic n="check" sz={11} color={T.ok}/>Mic OK</>
                          :<>Test Mic</>}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              {/* Acknowledgement */}
              <div style={{marginTop:14,padding:"10px 12px",borderRadius:10,
                  border:`1.5px solid ${ackChecked?T.p:T.bdr}`,
                  background:ackChecked?T.pLt:canAck?T.sur:"#F5F5F7",
                  opacity:canAck?1:.55,transition:"all .15s"}}>
                <Checkbox checked={ackChecked} disabled={!canAck} onChange={v=>setAckChecked(v)} size={18}
                  label="I understand the rules and agree that exiting early, disabling my camera, or repeated tab-switch violations may result in a failed test."/>
              </div>
              {!canAck&&(
                <div style={{marginTop:6,fontSize:11,color:T.muted,display:"flex",alignItems:"center",gap:4}}>
                  <Ic n="info" sz={12} color={T.muted}/>Test your camera and microphone to continue.
                </div>
              )}
            </div>
            <div style={{padding:mob?"10px 16px 12px":"12px 22px 16px",display:"flex",gap:9,justifyContent:"flex-end",
              borderTop:`1px solid ${T.bdr}`,flexShrink:0}}>
              <Btn variant="ghost" size="sm" onClick={()=>setPreExam(null)}>Cancel</Btn>
              <Btn size="sm" onClick={()=>{setPreExam(null);onStartExam();}} disabled={!canJoin}>
                <Ic n="videocam" sz={14} color="#fff" fill={1}/>Acknowledge & Join
              </Btn>
            </div>
        </Modal>
        );
      })()}
    </>
  );
}

/* ── Exam Interface ───────────────────────────────────────────────────────── */
function ExamScreen({onSubmit,mob}){
  const [cur,setCur]=useState(0);
  const [mcqA,setMcqA]=useState({});
  const [txtA,setTxtA]=useState({});
  const [shortA,setShortA]=useState({});
  const [tfA,setTfA]=useState({});
  const [matchA,setMatchA]=useState({});   // {qIdx: [rightIdx0, rightIdx1, ...]}
  const [voiceA,setVoiceA]=useState({});   // {qIdx: {recording:bool, duration:number, done:bool}}
  const [flagged,setFlagged]=useState(new Set());
  const [secs,setSecs]=useState(90*60);
  const [confirm,setConfirm]=useState(false);
  const [savedAt,setSavedAt]=useState(Date.now());
  const [offline,setOffline]=useState(false);
  const submittedRef=useRef(false);
  useEffect(()=>{const t=setInterval(()=>setSecs(x=>x>0?x-1:0),1000);return()=>clearInterval(t);},[]);
  // Guard against accidental exit (back / refresh / close)
  useEffect(()=>{
    const guard=e=>{if(!submittedRef.current){e.preventDefault();e.returnValue="";}};
    window.addEventListener("beforeunload",guard);
    return()=>window.removeEventListener("beforeunload",guard);
  },[]);
  // Connection-loss grace banner
  useEffect(()=>{
    const off=()=>setOffline(true), on=()=>setOffline(false);
    window.addEventListener("offline",off);window.addEventListener("online",on);
    return()=>{window.removeEventListener("offline",off);window.removeEventListener("online",on);};
  },[]);
  // Autosave pulse whenever any answer changes
  useEffect(()=>{setSavedAt(Date.now());},[mcqA,txtA,shortA,tfA,matchA,voiceA]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const q=EQ[cur];

  const isAnswered=(i)=>{
    const qq=EQ[i];
    if(qq.type==="mcq")   return mcqA[i]!==undefined;
    if(qq.type==="text")  return(txtA[i]||"").trim().length>0;
    if(qq.type==="short") return(shortA[i]||"").trim().length>=(qq.minChars||1);
    if(qq.type==="tf")    return tfA[i]!==undefined;
    if(qq.type==="match") return matchA[i]&&matchA[i].length===qq.left.length;
    if(qq.type==="voice") return voiceA[i]&&voiceA[i].done;
    return false;
  };
  const answered=EQ.filter((_,i)=>isAnswered(i)).length;
  const allDone=answered===EQ.length;
  const timerC=secs<600?T.err:secs<1800?T.warn:T.ok;

  const pillState=i=>flagged.has(i)?"flagged":isAnswered(i)?"answered":"none";
  const Pill=({i,size=38})=><QPill n={i+1} size={size} active={i===cur} state={pillState(i)} onClick={()=>setCur(i)}/>;

  /* Voice recorder simulation */
  const startRecording=()=>{
    setVoiceA({...voiceA,[cur]:{recording:true,duration:0,done:false}});
    const iv=setInterval(()=>{
      setVoiceA(prev=>{
        const v=prev[cur];
        if(!v||!v.recording){clearInterval(iv);return prev;}
        const nd=v.duration+1;
        if(nd>=(q.maxSecs||120)){clearInterval(iv);return{...prev,[cur]:{...v,recording:false,duration:nd,done:true}};}
        return{...prev,[cur]:{...v,duration:nd}};
      });
    },1000);
  };
  const stopRecording=()=>{
    setVoiceA(prev=>({...prev,[cur]:{...prev[cur],recording:false,done:true}}));
  };

  /* Match: handle clicking right item to assign to left slot */
  const handleMatchSelect=(leftIdx,rightIdx)=>{
    const prev=matchA[cur]||[];
    const next=[...prev];
    next[leftIdx]=rightIdx;
    setMatchA({...matchA,[cur]:next});
  };

  const tc=TYPE_COLORS[q.type]||[T.p,T.pLt];

  // Keyboard shortcuts: arrows navigate, 1–4 pick MCQ option, T/F for true-false
  useEffect(()=>{
    const onKey=e=>{
      const tag=(e.target.tagName||"").toLowerCase();
      if(confirm||tag==="input"||tag==="textarea"||tag==="select")return;
      if(e.key==="ArrowRight"){setCur(x=>Math.min(EQ.length-1,x+1));}
      else if(e.key==="ArrowLeft"){setCur(x=>Math.max(0,x-1));}
      else if(q.type==="mcq"&&["1","2","3","4"].includes(e.key)){const i=+e.key-1;if(i<q.opts.length)setMcqA(a=>({...a,[cur]:i}));}
      else if(q.type==="tf"&&(e.key==="t"||e.key==="T"))setTfA(a=>({...a,[cur]:true}));
      else if(q.type==="tf"&&(e.key==="f"||e.key==="F"))setTfA(a=>({...a,[cur]:false}));
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[cur,q,confirm]);

  return(
    <div style={{display:"flex",height:"100vh",flexDirection:"column",fontFamily:"'Sora',sans-serif"}}>
      {/* Exam topbar */}
      <div style={{background:T.sur,borderBottom:`1px solid ${T.bdr}`,padding:mob?"0 12px":"0 24px",height:mob?52:60,
        display:"flex",alignItems:"center",gap:mob?8:16,flexShrink:0}}>
        <div style={{fontWeight:700,fontSize:mob?12:15,color:T.txt,fontFamily:"Manrope",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Digital Systems Architecture — Mid Semester Exam</div>
        {!mob&&<div role="status" style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:T.ok,
          background:T.okBg,border:`1px solid ${T.ok}33`,borderRadius:999,padding:"6px 12px",whiteSpace:"nowrap"}}>
          <Ic n="cloud_done" sz={15} color={T.ok} fill={1}/>All answers saved
        </div>}
        <div role="timer" aria-live={secs===600||secs===60?"assertive":"off"}
          aria-label={`${Math.floor(secs/60)} minutes ${secs%60} seconds remaining`}
          style={{background:timerC+"18",border:`1.5px solid ${timerC}33`,borderRadius:10,
          padding:"7px 16px",fontWeight:800,fontSize:18,color:timerC,fontFamily:"Manrope",
          display:"flex",alignItems:"center",gap:7}}>
          <Ic n="timer" sz={18} color={timerC}/>{fmt(secs)}
          {secs<600&&<span style={{fontSize:11,fontWeight:700}}>left</span>}
        </div>
        <Btn variant={allDone?"filled":"ghost"} onClick={()=>setConfirm(true)}>Submit exam</Btn>
      </div>
      {offline&&(
        <div role="alert" style={{background:T.warnBg,borderBottom:`1px solid ${T.warn}55`,padding:"9px 16px",
          display:"flex",alignItems:"center",gap:9,fontSize:13,fontWeight:600,color:"#92400E",flexShrink:0}}>
          <Ic n="wifi_off" sz={17} color={T.warn}/>
          Connection lost — your answers are saved on this device. Reconnect to continue; your timer keeps running.
        </div>
      )}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Question area */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
        <div style={{flex:1,overflowY:"auto",padding:mob?"16px":"26px 30px"}}>
          <div style={{display:"flex",gap:8,marginBottom:mob?12:20,flexWrap:"wrap"}}>
            <Badge color={T.p}>Question {cur+1} of {EQ.length}</Badge>
            <Badge color={tc[0]} bg={tc[1]}>
              <Ic n={q.type==="mcq"?"radio_button_checked":q.type==="tf"?"toggle_on":q.type==="short"?"short_text":q.type==="text"?"notes":q.type==="voice"?"mic":q.type==="match"?"swap_horiz":"quiz"} sz={13} color={tc[0]} fill={1}/>
              {TYPE_LABELS[q.type]||q.type}
            </Badge>
            {flagged.has(cur)&&<Badge color={T.warn} bg={T.warnBg}><Ic n="flag" sz={12} color={T.warn} fill={1}/>Flagged</Badge>}
          </div>
          {mob&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <div style={{flex:1,display:"flex",gap:6,overflowX:"auto",WebkitOverflowScrolling:"touch",paddingBottom:4}} role="group" aria-label="Question navigator">
                {EQ.map((_,i)=><Pill key={i} i={i}/>)}
              </div>
              <span style={{fontSize:12,fontWeight:700,color:T.muted,flexShrink:0}}>{answered}/{EQ.length}</span>
            </div>}
          <div style={{fontSize:mob?16:18,fontWeight:600,color:T.txt,lineHeight:1.65,marginBottom:q.img?14:(mob?18:24),fontFamily:"Manrope"}}>{q.q}</div>
          {q.img&&<QuestionDiagram kind={q.img} alt={q.imgAlt}/>}

          {/* ── MCQ ── */}
          {q.type==="mcq"&&(
            <div role="radiogroup" aria-label="Answer options" style={{display:"flex",flexDirection:"column",gap:11}}>
              {q.opts.map((opt,i)=>{
                const sel=mcqA[cur]===i;
                return(
                  <button key={i} role="radio" aria-checked={sel} onClick={()=>setMcqA({...mcqA,[cur]:i})}
                    style={{padding:mob?"12px 14px":"14px 16px",border:`2px solid ${sel?T.p:T.bdr}`,borderRadius:12,
                      background:sel?T.pLt:"#fff",cursor:"pointer",display:"flex",gap:14,alignItems:"center",
                      transition:"all .12s",width:"100%",textAlign:"left",fontFamily:"inherit"}}>
                    <span aria-hidden="true" style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${sel?T.p:T.bdr}`,
                      background:sel?T.p:"#fff",display:"flex",alignItems:"center",justifyContent:"center",
                      flexShrink:0,fontWeight:700,fontSize:13,color:sel?"#fff":T.muted}}>
                      {LETTERS[i]}
                    </span>
                    <span style={{fontSize:15,fontWeight:sel?600:400,color:sel?T.p:T.txt}}>{opt}</span>
                  </button>
                );
              })}
            </div>
          )}

          {/* ── True / False ── */}
          {q.type==="tf"&&(
            <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
              {[true,false].map(val=>{
                const sel=tfA[cur]===val;
                const ico=val?"check_circle":"cancel";
                const col=val?"#059669":"#DC2626";
                return(
                  <button key={String(val)} role="radio" aria-checked={sel} onClick={()=>setTfA({...tfA,[cur]:val})}
                    style={{flex:1,minWidth:mob?120:180,padding:mob?"18px":"24px",borderRadius:14,
                      border:`2.5px solid ${sel?col:T.bdr}`,background:sel?col+"10":"#fff",
                      cursor:"pointer",textAlign:"center",transition:"all .15s",fontFamily:"inherit"}}>
                    <Ic n={ico} sz={36} color={sel?col:T.bdr} fill={sel?1:0}/>
                    <div style={{fontWeight:700,fontSize:18,color:sel?col:T.muted,marginTop:8,fontFamily:"Manrope"}}>{val?"True":"False"}</div>
                  </button>
                );
              })}
            </div>
          )}

          {/* ── Short Answer ── */}
          {q.type==="short"&&(
            <div>
              <textarea value={shortA[cur]||""} onChange={e=>setShortA({...shortA,[cur]:e.target.value})}
                placeholder="Type your short answer here…" rows={3}
                style={{width:"100%",padding:mob?"12px 14px":"14px 16px",border:`2px solid ${(shortA[cur]||"").trim().length>=(q.minChars||1)?T.ok:(shortA[cur]||"").trim()?T.p:T.bdr}`,
                  borderRadius:12,fontSize:14,resize:"vertical",
                  fontFamily:"'Sora',sans-serif",lineHeight:1.75,color:T.txt}}
                onFocus={e=>e.target.style.borderColor=T.p}
                onBlur={e=>e.target.style.borderColor=(shortA[cur]||"").trim().length>=(q.minChars||1)?T.ok:(shortA[cur]||"").trim()?T.p:T.bdr}/>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
                <div style={{fontSize:12,color:(shortA[cur]||"").length>=(q.minChars||1)?T.ok:T.muted,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
                  {(shortA[cur]||"").length>=(q.minChars||1)&&<Ic n="check_circle" sz={14} color={T.ok} fill={1}/>}
                  {(shortA[cur]||"").length} / {q.minChars||60} characters minimum
                </div>
                <div style={{fontSize:11,color:T.muted}}>{(shortA[cur]||"").trim().split(/\s+/).filter(Boolean).length} words</div>
              </div>
            </div>
          )}

          {/* ── Long Text Answer ── */}
          {q.type==="text"&&(
            <textarea value={txtA[cur]||""} onChange={e=>setTxtA({...txtA,[cur]:e.target.value})}
              placeholder="Type your detailed answer here…" rows={8}
              style={{width:"100%",padding:mob?"12px 14px":"14px 16px",border:`2px solid ${(txtA[cur]||"").trim()?T.p:T.bdr}`,
                borderRadius:12,fontSize:14,resize:"vertical",
                fontFamily:"'Sora',sans-serif",lineHeight:1.75,color:T.txt}}
              onFocus={e=>e.target.style.borderColor=T.p}
              onBlur={e=>e.target.style.borderColor=(txtA[cur]||"").trim()?T.p:T.bdr}/>
          )}

          {/* ── Voice Record ── */}
          {q.type==="voice"&&(()=>{
            const v=voiceA[cur]||{recording:false,duration:0,done:false};
            const maxS=q.maxSecs||120;
            const pct=Math.min((v.duration/maxS)*100,100);
            return(
              <div style={{border:`2px solid ${v.done?T.ok:v.recording?T.err:T.bdr}`,borderRadius:16,padding:mob?"20px":"28px",textAlign:"center",background:v.recording?"#FEF2F2":"#fff"}}>
                <div style={{width:80,height:80,borderRadius:"50%",margin:"0 auto 16px",
                  background:v.recording?T.err+"18":v.done?T.okBg:T.bg,
                  border:`3px solid ${v.recording?T.err:v.done?T.ok:T.bdr}`,
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <Ic n={v.recording?"stop_circle":v.done?"check_circle":"mic"} sz={36}
                    color={v.recording?T.err:v.done?T.ok:T.muted} fill={1}/>
                </div>
                <div style={{fontWeight:700,fontSize:22,color:v.recording?T.err:v.done?T.ok:T.txt,fontFamily:"Manrope",marginBottom:4}}>
                  {v.recording?"Recording…":v.done?"Recording Saved":"Ready to Record"}
                </div>
                <div style={{fontSize:14,color:T.muted,marginBottom:16}}>
                  {fmt(v.duration)} / {fmt(maxS)} {v.recording?"— Speak clearly into your microphone":""}
                </div>
                {/* Progress bar */}
                <div style={{height:6,background:T.bdr,borderRadius:99,marginBottom:20,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${pct}%`,background:v.recording?T.err:v.done?T.ok:T.p,borderRadius:99,transition:"width .3s"}}/>
                </div>
                <div style={{display:"flex",justifyContent:"center",gap:12}}>
                  {!v.recording&&!v.done&&(
                    <Btn onClick={startRecording}><Ic n="mic" sz={16} color="#fff" fill={1}/>Start Recording</Btn>
                  )}
                  {v.recording&&(
                    <Btn onClick={stopRecording} style={{background:T.err}}><Ic n="stop" sz={16} color="#fff"/>Stop Recording</Btn>
                  )}
                  {v.done&&(
                    <>
                      <Btn variant="ghost" onClick={()=>setVoiceA({...voiceA,[cur]:{recording:false,duration:0,done:false}})}>
                        <Ic n="replay" sz={16} color={T.muted}/>Re-record
                      </Btn>
                      <div style={{display:"flex",alignItems:"center",gap:6,color:T.ok,fontWeight:700,fontSize:14}}>
                        <Ic n="check_circle" sz={18} color={T.ok} fill={1}/>Saved
                      </div>
                    </>
                  )}
                </div>
              </div>
            );
          })()}

          {/* ── Match the Following ── */}
          {q.type==="match"&&(()=>{
            const sel=matchA[cur]||[];
            const usedRight=new Set(sel.filter(x=>x!==undefined));
            return(
              <div>
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  {q.left.map((leftItem,li)=>{
                    const assigned=sel[li];
                    return(
                      <div key={li} style={{display:"flex",alignItems:"center",gap:mob?8:14,flexWrap:mob?"wrap":"nowrap"}}>
                        {/* Left item */}

            <Btn variant={allDone?"filled":"ghost"} full onClick={()=>setConfirm(true)} style={{marginTop:8,justifyContent:"center"}}>Submit exam</Btn>

          </div>
          <h2 id="exam-confirm-title" style={{margin:"0 0 6px",fontWeight:700,fontSize:18,color:T.txt,fontFamily:"Manrope"}}>
            {allDone?"Submit your exam?":"You have unanswered questions"}
          </h2>
          <div style={{fontSize:14,color:T.muted,marginBottom:16}}>
            {allDone
              ?"You've answered all questions. Submitting can't be undone."
              :`${EQ.length-answered} question${EQ.length-answered!==1?"s":""} still unanswered.`}
          </div>
          {(!allDone||flagged.size>0)&&(
            <div style={{textAlign:"left",background:T.bg,borderRadius:12,padding:"12px 14px",marginBottom:18}}>
              {!allDone&&(
                <div style={{marginBottom:flagged.size>0?10:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:T.err,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Unanswered — tap to jump</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {EQ.map((_,i)=>!isAnswered(i)?(
                      <QPill key={i} n={i+1} size={34} state="wrong" onClick={()=>{setConfirm(false);setCur(i);}}/>
                    ):null)}
                  </div>
                </div>

              {flagged.size>0&&(
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:T.warn,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Flagged for review</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {[...flagged].sort((a,b)=>a-b).map(i=>(
                      <QPill key={i} n={i+1} size={34} state="flagged" onClick={()=>{setConfirm(false);setCur(i);}}/>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
          <div style={{display:"flex",gap:12,justifyContent:"center"}}>
            <Btn variant="ghost" onClick={()=>setConfirm(false)}>Keep answering</Btn>
            <Btn variant="filled" onClick={()=>{submittedRef.current=true;pushToast({variant:"success",message:"Your exam has been submitted successfully."});onSubmit();}}>Submit now</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}

                    <div style={{fontSize:14,fontWeight:600,color:T.txt,lineHeight:1.55}}>{q.q}</div>
                  </div>
                </div>

                <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"1fr 1fr",gap:10,marginBottom:q.aiNote?12:0}}>

                    <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>
                      <Ic n="person" sz={12} color={T.muted}/>Your Answer
                    </div>
                    <div style={{fontSize:13,color:T.txt,lineHeight:1.55}}>{q.yourAnswer}</div>

                  <div style={{background:T.sur,borderRadius:10,padding:"10px 12px",border:`1px solid ${T.ok}44`}}>
                    <div style={{fontSize:11,fontWeight:700,color:T.ok,textTransform:"uppercase",letterSpacing:.5,marginBottom:4,display:"flex",alignItems:"center",gap:4}}>

                    </div>
                    <div style={{fontSize:13,color:T.txt,lineHeight:1.55}}>{q.rightAnswer}</div>
                  </div>
                </div>

                {/* AI Note (if any) */}
                {q.aiNote&&(
                  <div style={{background:T.pLt,borderRadius:10,padding:"10px 12px",border:`1px solid ${T.p}22`,
                    display:"flex",gap:8,alignItems:"flex-start"}}>
                    <Ic n="auto_awesome" sz={14} color={T.p} fill={1}/>
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:T.p,textTransform:"uppercase",letterSpacing:.5,marginBottom:2}}>AI Feedback</div>
                      <div style={{fontSize:12,color:T.txt,lineHeight:1.55}}>{q.aiNote}</div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}
