          {cls.notes&&(
            <div style={{padding:"10px 14px",background:T.infoBg,borderRadius:8,border:`1px solid ${T.info}33`,
              fontSize:13,color:T.info,display:"flex",gap:8,alignItems:"flex-start"}}>
              <Ic n="sticky_note_2" sz={16} color={T.info}/>
              <div><strong>Note:</strong> {cls.notes}</div>
            </div>
          )}
          {/* Attachments */}
          {cls.attachments&&cls.attachments.length>0&&(
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Attached Materials</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {cls.attachments.map((a,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:T.bg,borderRadius:8,cursor:"pointer"}}
                    onMouseEnter={e=>e.currentTarget.style.background=T.pLt}
                    onMouseLeave={e=>e.currentTarget.style.background=T.bg}>
                    <Ic n="attach_file" sz={16} color={T.p}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:T.txt}}>{a.name}</div>
                      <div style={{fontSize:11,color:T.muted}}>{a.size}</div>
                    </div>
                    <Ic n="download" sz={16} color={T.p}/>
                  </div>
                ))}
              </div>
            </div>
          )}
          {/* Resources for completed */}
          {isComp&&cls.resources&&cls.resources.length>0&&(
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Resources</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {cls.resources.map((r,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:T.bg,borderRadius:8,cursor:"pointer"}}
                    onMouseEnter={e=>e.currentTarget.style.background=T.pLt}
                    onMouseLeave={e=>e.currentTarget.style.background=T.bg}>
                    <Ic n="folder_zip" sz={16} color={T.p}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:T.txt}}>{r.name}</div>
                      <div style={{fontSize:11,color:T.muted}}>{r.size}</div>
                    </div>
                    <Ic n="download" sz={16} color={T.p}/>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
        {/* Footer actions */}
        <div style={{padding:"14px 24px",borderTop:`1px solid ${T.bdr}`,display:"flex",gap:10,justifyContent:"flex-end",flexShrink:0}}>
          <Btn variant="ghost" size="sm" onClick={()=>setDetailClass(null)}>Close</Btn>
          {!isComp&&cls.status==="live"&&(
            <Btn size="sm"><Ic n="videocam" sz={14} color="#fff"/>Join now</Btn>
          )}
          {isComp&&cls.recording?.available&&(
            <Btn size="sm"><Ic n="play_circle" sz={14} color="#fff" fill={1}/>Watch recording</Btn>
          )}
        </div>
      </div>
    );
  };

  /* ── Render ── */
  return(
    <div className="fu" style={{padding:mob?"16px":"24px 28px",display:"flex",flexDirection:"column",gap:20}}>
      {/* Page header */}
      <div>
        <div style={{fontSize:mob?20:24,fontWeight:800,color:T.txt,fontFamily:"Manrope"}}>Live Classes</div>
        <div style={{fontSize:14,color:T.muted,marginTop:4}}>Attend scheduled sessions, join live lectures, and watch recordings anytime.</div>
      </div>

      {/* Stats */}
      {loading?(
        <div style={{display:"grid",gridTemplateColumns:mob?"1fr 1fr":"repeat(4,1fr)",gap:14}}>
          {[1,2,3,4].map(i=><Card key={i} p="16px 18px"><div style={{display:"flex",gap:12}}><Skel w={40} h={40} r={10}/><div style={{flex:1}}><Skel w="60%" h={18} style={{marginBottom:6}}/><Skel w="80%" h={12}/></div></div></Card>)}
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:mob?"1fr 1fr":"repeat(4,1fr)",gap:14}}>
          <StatCard icon="today" label="Today's classes" value={todayCount} color={T.p}/>
          <StatCard icon="event_upcoming" label="Upcoming this week" value={upcoming.length} color={T.info}/>
          <StatCard icon="check_circle" label="Completed classes" value={completed.length} color={T.ok}/>
          <StatCard icon="hourglass_bottom" label="Total learning hours" value={`${totalHours.toFixed(1)}h`} color={T.warn}/>
        </div>
      )}

      {/* Live Now hero */}
      {loading?(
        <Card p="0" style={{overflow:"hidden"}}><Skel w="100%" h={180} r={0}/></Card>
      ):live?(
        <Card p="0" style={{overflow:"hidden",background:`linear-gradient(135deg,${T.pDk} 0%,${T.p} 55%,${T.pMd} 100%)`,border:"none"}}>
          <div style={{padding:mob?"20px":"24px 28px",display:"flex",gap:24,alignItems:"center",position:"relative"}}>
            <div style={{position:"absolute",right:-30,top:-40,width:200,height:200,borderRadius:"50%",background:"rgba(255,255,255,.04)"}}/>
            <div style={{position:"absolute",right:120,bottom:-80,width:180,height:180,borderRadius:"50%",background:"rgba(255,255,255,.04)"}}/>
            <div style={{flex:1,zIndex:1}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
                <span style={{display:"flex",alignItems:"center",gap:5,fontSize:12,fontWeight:700,padding:"4px 12px",borderRadius:99,
                  background:"#DC2626",color:"#fff"}}>
                  <span style={{width:7,height:7,borderRadius:"50%",background:"#fff",animation:"blink 1.4s infinite"}}/>LIVE
                </span>
                <span style={{fontSize:12,color:"rgba(255,255,255,.85)",fontWeight:600}}>{live.remaining}</span>
              </div>
              <div style={{fontSize:mob?18:22,fontWeight:800,color:"#fff",fontFamily:"Manrope",marginBottom:6}}>{live.subject}</div>
              <div style={{fontSize:14,color:"rgba(255,255,255,.85)",marginBottom:14}}>{live.course}</div>
              <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap",marginBottom:18}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,.18)",display:"flex",alignItems:"center",justifyContent:"center",
                    fontWeight:700,fontSize:11,color:"#fff"}}>{live.facultyInit}</div>
                  <span style={{fontSize:13,color:"rgba(255,255,255,.88)",fontWeight:500}}>{live.faculty}</span>
                </div>
                <span style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:"rgba(255,255,255,.82)"}}>
                  <Ic n="schedule" sz={14} color="rgba(255,255,255,.82)"/>{live.startTime} – {live.endTime}
                </span>
                <span style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:"rgba(255,255,255,.82)"}}>
                  <Ic n="group" sz={14} color="rgba(255,255,255,.82)"/>{live.attendees}/{live.maxAttendees} attending
                </span>
              </div>
              <div style={{display:"flex",gap:10}}>
                <Btn style={{background:"#fff",color:T.p,boxShadow:"0 4px 14px rgba(0,0,0,.18)"}}><Ic n="videocam" sz={16} color={T.p}/>Join now</Btn>
                <Btn variant="ghost" style={{color:"rgba(255,255,255,.88)",borderColor:"rgba(255,255,255,.25)"}}>
                  <Ic n="event" sz={14} color="rgba(255,255,255,.88)"/>Add to calendar
                </Btn>
              </div>
            </div>
          </div>
        </Card>
      ):(
        <Card p="28px" style={{textAlign:"center"}}>
          <Ic n="videocam_off" sz={40} color={T.muted}/>
          <div style={{fontWeight:600,fontSize:15,color:T.txt,marginTop:10}}>No live class right now</div>
          <div style={{fontSize:13,color:T.muted,marginTop:4}}>
            {upcoming.length>0?`Next up: ${upcoming[0].subject} · ${upcoming[0].date} at ${upcoming[0].startTime}`:"No upcoming classes scheduled."}
          </div>
        </Card>
      )}

      {/* Tabs + filter */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",borderBottom:`1.5px solid ${T.bdr}`,marginBottom:18,flexWrap:"wrap",gap:8}}>
          <div role="tablist" style={{display:"flex",gap:0}}>
            {[{id:"upcoming",label:"Upcoming",count:upcoming.length},{id:"completed",label:"Completed",count:completed.length}].map(t=>(
              <button key={t.id} role="tab" aria-selected={tab===t.id} tabIndex={tab===t.id?0:-1}
                onClick={()=>setTab(t.id)}
                style={{padding:"10px 20px",border:"none",borderBottom:`2.5px solid ${tab===t.id?T.p:"transparent"}`,
                  marginBottom:-1.5,background:"none",cursor:"pointer",fontFamily:"inherit",
                  fontSize:14,fontWeight:tab===t.id?600:400,color:tab===t.id?T.p:T.muted,
                  display:"flex",alignItems:"center",gap:7,whiteSpace:"nowrap"}}>
                {t.label}
                <span style={{fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:99,
                  background:tab===t.id?T.p:T.bdr,color:tab===t.id?"#fff":T.muted,minWidth:22,textAlign:"center"}}>
                  {t.count}
                </span>
              </button>
            ))}
          </div>
        </div>
        {/* Filters */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
          <div style={{position:"relative",flex:1,minWidth:200,maxWidth:280}}>
            <Ic n="search" sz={16} color={T.muted} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)"}}/>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search classes…"
              style={{width:"100%",padding:"9px 14px 9px 36px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
                fontSize:13,color:T.txt,background:T.sur,fontFamily:"inherit"}}/>
          </div>
          <div style={{position:"relative",minWidth:160}}>
            <select value={courseFilter} onChange={e=>setCourseFilter(e.target.value)} aria-label="Filter by course"
              style={{width:"100%",padding:"9px 30px 9px 14px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
                fontSize:13,color:courseFilter?T.txt:T.muted,background:T.sur,appearance:"none",cursor:"pointer",fontFamily:"inherit"}}>
              <option value="">All courses</option>
              {courses.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <Ic n="expand_more" sz={16} color={T.muted} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
          </div>
          <div style={{position:"relative",minWidth:160}}>
            <select value={facultyFilter} onChange={e=>setFacultyFilter(e.target.value)} aria-label="Filter by faculty"
              style={{width:"100%",padding:"9px 30px 9px 14px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
                fontSize:13,color:facultyFilter?T.txt:T.muted,background:T.sur,appearance:"none",cursor:"pointer",fontFamily:"inherit"}}>
              <option value="">All faculty</option>
              {faculties.map(f=><option key={f} value={f}>{f}</option>)}
            </select>
            <Ic n="expand_more" sz={16} color={T.muted} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
          </div>
          {(search||courseFilter||facultyFilter)&&(
            <button onClick={()=>{setSearch("");setCourseFilter("");setFacultyFilter("");}}
              style={{padding:"8px 14px",border:`1.5px solid ${T.bdr}`,borderRadius:10,background:T.sur,
                cursor:"pointer",fontSize:12,color:T.muted,fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}>
              <Ic n="close" sz={14} color={T.muted}/>Clear
            </button>
          )}
        </div>
      </div>

      {/* Cards grid */}
      {loading?(
        <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"repeat(3,1fr)",gap:16}}>
          {[1,2,3,4,5,6].map(i=>(
            <Card key={i} p="20px 22px">
              <Skel w="70%" h={16} style={{marginBottom:10}}/>
              <Skel w="50%" h={12} style={{marginBottom:14}}/>
              <div style={{display:"flex",gap:8,marginBottom:14}}><Skel w={28} h={28} r={99}/><Skel w="40%" h={14}/></div>
              <Skel w="90%" h={12} style={{marginBottom:8}}/>
              <Skel w="60%" h={12} style={{marginBottom:16}}/>
              <Skel w="100%" h={36} r={10}/>
            </Card>
          ))}
        </div>
      ):(
        <div role="tabpanel">
          {tab==="upcoming"&&(()=>{
            const list=filterList(upcoming);
            if(!list.length)return(
              <Card p="60px 40px" style={{textAlign:"center"}}>
                <Ic n="event_busy" sz={48} color={T.muted}/>
                <div style={{fontWeight:600,fontSize:16,color:T.txt,marginTop:12}}>No upcoming live classes</div>
                <div style={{fontSize:13,color:T.muted,marginTop:4}}>New sessions will appear here once scheduled by your faculty.</div>
              </Card>
            );
            return(
              <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"repeat(3,1fr)",gap:16}}>
                {list.map(c=><ClassCard key={c.id} cls={c}/>)}
              </div>
            );
          })()}
          {tab==="completed"&&(()=>{
            const list=filterList(completed);
            if(!list.length)return(
              <Card p="60px 40px" style={{textAlign:"center"}}>
                <Ic n="history" sz={48} color={T.muted}/>
                <div style={{fontWeight:600,fontSize:16,color:T.txt,marginTop:12}}>No completed classes yet</div>
                <div style={{fontSize:13,color:T.muted,marginTop:4}}>Completed sessions and recordings will show up here.</div>
              </Card>
            );
            return(
              <div style={{display:"grid",gridTemplateColumns:mob?"1fr":"repeat(3,1fr)",gap:16}}>
                {list.map(c=><ClassCard key={c.id} cls={c} isCompleted/>)}
              </div>
            );
          })()}
        </div>
      )}

      {/* Detail dialog */}
      <Modal open={!!detailClass} onClose={()=>setDetailClass(null)} labelledBy="class-detail-title" maxWidth={640} mob={mob}>
        <DetailContent cls={detailClass}/>
      </Modal>
    </div>
  );
}


/* ── Assignments ─────────────────────────────────────────────────────────── */
function AssignmentsScreen({mob}){
  const [tab,setTab]=useState("available");
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(null);
  const [text,setText]=useState("");
  const [files,setFiles]=useState([]);
  const fileRef=useRef();
  const submitAssignment=(a)=>{
    if(files.length===0&&!text.trim()){
      pushToast({variant:"error",message:"Your submission could not be sent — attach a file or add notes first."});
      return;
    }
    pushToast({variant:"success",message:`"${a.title}" was submitted successfully.`});
    setFiles([]);setText("");
  };

  // Filter assignments by tab
  const available=ASGN.filter(a=>!a.submitted&&a.daysLeft>0);
  const submitted=ASGN.filter(a=>a.submitted);
  const overdue=ASGN.filter(a=>!a.submitted&&a.daysLeft<=0);
  
  const list=(tab==="available"?available:tab==="submitted"?submitted:overdue).filter(a=>
    !search||a.title.toLowerCase().includes(search.toLowerCase())||a.sub.toLowerCase().includes(search.toLowerCase())
  );

  /* Detail view */
  if(selected){
    const a=selected;
    return(
      <div className="fu" style={{padding:mob?"16px":"24px 28px",maxWidth:820,margin:"0 auto"}}>
        <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",cursor:"pointer",
          color:T.muted,fontFamily:"inherit",fontSize:13,fontWeight:600,display:"flex",
          alignItems:"center",gap:4,marginBottom:20}}>
          <Ic n="arrow_back" sz={16} color={T.muted}/>Back to assignments
        </button>

        {/* Header card */}
        <Card style={{marginBottom:16}}>
          <div style={{display:"flex",gap:14,alignItems:"flex-start",marginBottom:18}}>
            <div style={{width:44,height:44,borderRadius:12,background:a.submitted?T.okBg:a.daysLeft<=0?T.errBg:T.pLt,
              display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <Ic n={a.submitted?"task_alt":a.daysLeft<=0?"event_busy":"edit_note"} sz={22}
                color={a.submitted?T.ok:a.daysLeft<=0?T.err:T.p} fill={1}/>
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:3}}>{a.code} \u00b7 {a.sub}</div>
              <div style={{fontSize:mob?18:20,fontWeight:800,color:T.txt,fontFamily:"Manrope",lineHeight:1.3}}>{a.title}</div>
            </div>
          </div>

          {/* Key info row */}
          <div style={{display:"flex",gap:mob?12:20,flexWrap:"wrap",marginBottom:18,padding:"12px 16px",background:T.bg,borderRadius:10}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <Ic n="event" sz={16} color={a.daysLeft<=0?T.err:T.muted}/>
              <span style={{fontSize:13,color:a.daysLeft<=0?T.err:T.txt,fontWeight:600}}>
                {a.daysLeft<=0?"Closed":"Due "+a.deadline}
              </span>
              {a.daysLeft>0&&a.daysLeft<=3&&<Badge color={T.err} bg={T.errBg}>{a.daysLeft} day{a.daysLeft!==1?"s":""} left</Badge>}
              {a.daysLeft>3&&<Badge color={T.warn} bg={T.warnBg}>{a.daysLeft} days left</Badge>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <Ic n="emoji_events" sz={16} color={T.muted}/>
              <span style={{fontSize:13,color:T.txt,fontWeight:500}}>{a.max} marks</span>
            </div>
            {a.submitted&&a.grade&&(
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <Ic n="star" sz={16} color={T.ok} fill={1}/>
                <span style={{fontSize:13,color:T.ok,fontWeight:700}}>Grade: {a.grade} ({a.marks}/{a.max})</span>
              </div>
            )}
          </div>

          {/* Description */}
          <div style={{fontSize:14,color:T.txt,lineHeight:1.75,marginBottom:16}}>{a.desc}</div>

          {/* Reference files */}
          {a.files.length>0&&(
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Reference Files</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {a.files.map(f=>(
                  <div key={f} style={{display:"flex",alignItems:"center",gap:7,padding:"8px 14px",
                    border:`1.5px solid ${T.bdr}`,borderRadius:10,fontSize:13,color:T.p,fontWeight:500,cursor:"pointer",background:T.bg}}>
                    <Ic n="attach_file" sz={15} color={T.p}/>{f}
                  </div>
                ))}
              </div>
            </div>
          )}
        </Card>

        {/* Teacher feedback (if graded) */}
        {a.submitted&&a.feedback&&(
          <Card p="16px 18px" style={{border:`1.5px solid ${T.ok}33`,background:T.okBg,marginBottom:16}}>
            <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{width:36,height:36,borderRadius:10,background:T.ok,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Ic n="rate_review" sz={18} color="#fff" fill={1}/>
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:15,color:T.ok,fontFamily:"Manrope",marginBottom:5}}>Teacher Feedback</div>
                <div style={{fontSize:14,color:T.txt,lineHeight:1.7}}>{a.feedback}</div>
              </div>
            </div>
          </Card>
        )}

        {/* Submission form (only for open assignments) */}
        {!a.submitted&&a.daysLeft>0&&(
          <Card>
            <div style={{fontWeight:700,fontSize:16,color:T.txt,fontFamily:"Manrope",marginBottom:16}}>Submit Your Work</div>
            {/* Upload files */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:7}}>Upload Files</div>
              <div onClick={()=>fileRef.current?.click()}
                style={{border:`2px dashed ${T.bdr}`,borderRadius:12,padding:"24px",textAlign:"center",cursor:"pointer",transition:"all .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=T.p;e.currentTarget.style.background=T.pLt;}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.background="transparent";}}>
                <div style={{width:40,height:40,borderRadius:12,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 8px"}}>
                  <Ic n="upload_file" sz={22} color={T.p}/>
                </div>
                <div style={{fontWeight:600,color:T.txt,marginBottom:3,fontSize:14}}>Click to upload or drag files</div>
                <div style={{fontSize:12,color:T.muted}}>PDF \u00b7 DOCX \u00b7 ZIP \u00b7 Images \u00b7 Max 50 MB</div>
              </div>
              <input ref={fileRef} type="file" multiple style={{display:"none"}}
                onChange={e=>setFiles([...files,...Array.from(e.target.files).map(f=>f.name)])}/>
              {files.length>0&&(
                <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:7}}>
                  {files.map((f,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 11px",
                      background:T.okBg,border:`1px solid ${T.ok}33`,borderRadius:8,fontSize:13}}>
                      <Ic n="check_circle" sz={14} color={T.ok} fill={1}/>{f}
                      <button onClick={()=>setFiles(files.filter((_,j)=>j!==i))}
                        style={{background:"none",border:"none",cursor:"pointer",color:T.muted,display:"flex",padding:0}}>
                        <Ic n="close" sz={14} color={T.muted}/>
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            {/* Notes */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:T.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:7}}>
                Notes <span style={{textTransform:"none",fontWeight:400}}>(optional)</span>
              </div>
              <textarea value={text} onChange={e=>setText(e.target.value)} rows={4}
                placeholder="Add any notes or explanations\u2026"
                style={{width:"100%",padding:"12px 14px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
                  fontSize:14,resize:"vertical",fontFamily:"inherit",lineHeight:1.7}}
                onFocus={e=>e.target.style.borderColor=T.p}
                onBlur={e=>e.target.style.borderColor=T.bdr}/>
            </div>
            <Btn full style={{justifyContent:"center"}} onClick={()=>submitAssignment(a)}>
              <Ic n="send" sz={15} color="#fff"/>Submit Assignment
            </Btn>
          </Card>
        )}

        {/* Closed message for overdue */}
        {!a.submitted&&a.daysLeft<=0&&(
          <Card p="20px" style={{background:T.errBg,border:`1.5px solid ${T.err}33`,textAlign:"center"}}>
            <Ic n="event_busy" sz={28} color={T.err} fill={1}/>
            <div style={{fontSize:15,fontWeight:700,color:T.err,fontFamily:"Manrope",marginTop:8}}>Submission Closed</div>
            <div style={{fontSize:13,color:T.muted,marginTop:4}}>This assignment was due {Math.abs(a.daysLeft)} days ago. Contact your instructor if you need an extension.</div>
          </Card>
        )}
      </div>
    );
  }

  /* List view */
  return(
    <div className="fu" style={{padding:mob?"16px":"24px 28px"}}>
      {/* Page header + search */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:20}}>
        <div>
          <div style={{fontSize:mob?20:24,fontWeight:800,color:T.txt,fontFamily:"Manrope"}}>My Assignments</div>
          <div style={{fontSize:13,color:T.muted,marginTop:3}}>
            {available.length} pending{overdue.length>0&&<span> \u00b7 <span style={{color:T.err,fontWeight:600}}>{overdue.length} overdue</span></span>}
            {overdue.length===0&&<span> \u00b7 all caught up</span>}
          </div>
        </div>
        {/* Search */}
        <div style={{position:"relative"}}>
          <Ic n="search" sz={18} color={T.muted} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search\u2026"
            style={{padding:"9px 36px 9px 34px",border:`1.5px solid ${T.bdr}`,borderRadius:10,
              fontSize:13,width:mob?"100%":"200px",background:T.sur,color:T.txt,transition:"border-color .15s"}}
            onFocus={e=>e.target.style.borderColor=T.p}
            onBlur={e=>e.target.style.borderColor=T.bdr}/>
          {search&&(
            <button onClick={()=>setSearch("")}
              style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",
                background:"none",border:"none",cursor:"pointer",color:T.muted,display:"flex",padding:2}}>
              <Ic n="close" sz={16}/>
            </button>
          )}
        </div>
      </div>

      {/* Tabs */}
      <TabRow
        tabs={[{id:"available",label:"To Do",count:available.length},{id:"submitted",label:"Submitted",count:submitted.length},{id:"overdue",label:"Overdue",count:overdue.length}]}
        active={tab} onTab={t=>{setTab(t);setSearch("");}}
      />

      {/* Assignment list */}
      {list.length===0
        ?<div style={{padding:"50px 0",textAlign:"center"}}>
            <Ic n="search_off" sz={44} color={T.muted}/>
            <div style={{fontSize:15,fontWeight:600,color:T.muted,marginTop:10}}>No assignments here</div>
            {search&&<Btn variant="tonal" size="sm" style={{marginTop:10}} onClick={()=>setSearch("")}>Clear search</Btn>}
          </div>
        :<div style={{display:"flex",flexDirection:"column",gap:mob?10:12}}>
          {list.map(a=>(
            <Card key={a.id} hoverable style={{cursor:"pointer",
              borderColor:tab==="overdue"?T.err+"44":T.bdr,
              borderWidth:tab==="overdue"?"1.5px":"1px"}}
              onClick={()=>setSelected(a)} p={mob?"14px 16px":"16px 20px"}>
              <div style={{display:"flex",alignItems:"center",gap:mob?12:16}}>
                {/* Icon */}
                <div style={{width:42,height:42,borderRadius:11,
                  background:tab==="overdue"?T.errBg:a.submitted?T.okBg:T.pLt,
                  display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <Ic n={tab==="overdue"?"event_busy":a.submitted?"task_alt":"edit_note"} sz={20}
                    color={tab==="overdue"?T.err:a.submitted?T.ok:T.p} fill={a.submitted||tab==="overdue"?1:0}/>
                </div>
                {/* Content */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:700,color:T.txt,fontFamily:"Manrope",marginBottom:2}}>{a.title}</div>
                  <div style={{fontSize:12,color:T.muted}}>{a.code} \u00b7 {a.sub}</div>
                </div>
                {/* Right side */}
                <div style={{textAlign:"right",flexShrink:0}}>
                  {a.submitted&&a.grade?(
                    <React.Fragment>
                      <div style={{fontSize:mob?18:20,fontWeight:800,color:T.ok,fontFamily:"Manrope"}}>{a.grade}</div>
                      <div style={{fontSize:11,color:T.muted}}>{a.marks}/{a.max}</div>
                    </React.Fragment>
                  ):tab==="overdue"?(
                    <React.Fragment>
                      <div style={{fontSize:12,fontWeight:700,color:T.err}}>Past Due</div>
                      <div style={{fontSize:11,color:T.muted}}>{Math.abs(a.daysLeft)}d ago</div>
                    </React.Fragment>
                  ):(
                    <React.Fragment>
                      <div style={{fontSize:13,fontWeight:600,color:a.daysLeft<=3?T.err:T.txt}}>{a.deadline}</div>
                      {a.daysLeft<=3&&<div style={{fontSize:11,fontWeight:600,color:T.err}}>{a.daysLeft}d left</div>}
                    </React.Fragment>
                  )}
                </div>
                {/* Arrow */}
                <Ic n="chevron_right" sz={20} color={T.muted} style={{flexShrink:0,marginLeft:4}}/>
              </div>
            </Card>
          ))}
        </div>
      }
    </div>
  );
}

/* ── Lightweight markdown inline parser ─────────────────────────────────── */
function eddyInline(text,kp){
  const out=[]; const rx=/(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\$[^$]+\$|\[[^\]]+\]\([^)]+\))/g;
  let last=0,m,i=0;
  while((m=rx.exec(text))){
    if(m.index>last)out.push(text.slice(last,m.index));
    const t=m[0];
    if(t.startsWith("`"))out.push(<code key={kp+"c"+i} style={{background:T.pLt,color:T.pDk,padding:"1px 5px",borderRadius:5,fontFamily:"'Sora',monospace",fontSize:"0.86em"}}>{t.slice(1,-1)}</code>);
    else if(t.startsWith("**"))out.push(<strong key={kp+"b"+i} style={{fontWeight:700,color:T.txt}}>{t.slice(2,-2)}</strong>);
    else if(t.startsWith("*"))out.push(<em key={kp+"i"+i}>{t.slice(1,-1)}</em>);
    else if(t.startsWith("$"))out.push(<span key={kp+"m"+i} style={{fontFamily:"'Cambria','Georgia',serif",fontStyle:"italic",background:"#F5F3FF",padding:"1px 6px",borderRadius:5,color:T.pDk,letterSpacing:.2}}>{t.slice(1,-1)}</span>);
    else{const mm=/\[([^\]]+)\]\(([^)]+)\)/.exec(t);out.push(<a key={kp+"l"+i} href={mm[2]} target="_blank" rel="noreferrer" style={{color:T.p,textDecoration:"underline",fontWeight:600}}>{mm[1]}</a>);}
    last=rx.lastIndex;i++;
  }
  if(last<text.length)out.push(text.slice(last));
  return out;
}

/* ── Syntax highlighter (safe token scanner, no innerHTML) ──────────────── */
function eddyHi(code){
  const rx=/(\/\/[^\n]*|#[^\n]*)|("(?:\\.|[^"])*"|'(?:\\.|[^'])*'|`(?:\\.|[^`])*`)|\b(const|let|var|function|return|if|else|for|while|class|import|from|export|default|def|print|public|private|static|void|new|await|async|true|false|null|None|True|False|self|int|float|double|char|String|boolean)\b|\b(\d+\.?\d*)\b/g;
  const out=[];let last=0,m,i=0;
  while((m=rx.exec(code))){
    if(m.index>last)out.push(code.slice(last,m.index));
    let col=null,it=false;
    if(m[1]){col="#8A93A6";it=true;} else if(m[2])col="#3B9C5A"; else if(m[3])col="#B06CE0"; else if(m[4])col="#E0913B";
    out.push(<span key={"h"+i} style={{color:col,fontStyle:it?"italic":"normal",fontWeight:m[3]?600:400}}>{m[0]}</span>);
    last=rx.lastIndex;i++;
  }
  if(last<code.length)out.push(code.slice(last));
  return out;
}

function EddyCode({code,lang}){
  const [copied,setCopied]=useState(false);
  const copy=()=>{try{navigator.clipboard.writeText(code);}catch(e){}setCopied(true);setTimeout(()=>setCopied(false),1400);};
  return(
    <div style={{borderRadius:12,overflow:"hidden",border:`1px solid ${T.bdr}`,margin:"10px 0",background:"#1E1B2E"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 12px",background:"#2A2540"}}>
        <span style={{fontSize:11,color:"#B9B2D0",fontWeight:600,letterSpacing:.5,textTransform:"uppercase",fontFamily:"'Sora',monospace"}}>{lang||"code"}</span>
        <button onClick={copy} aria-label="Copy code" style={{display:"flex",alignItems:"center",gap:4,background:"transparent",border:"none",color:"#B9B2D0",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",padding:"2px 4px"}}>
          <span className="msr" style={{fontSize:14}}>{copied?"check":"content_copy"}</span>{copied?"Copied":"Copy"}
        </button>
      </div>
      <pre style={{margin:0,padding:"12px 14px",overflowX:"auto",fontFamily:"'Sora',ui-monospace,monospace",fontSize:12.5,lineHeight:1.6,color:"#E8E4F5"}}><code>{eddyHi(code)}</code></pre>
    </div>
  );
}

/* ── Block-level markdown renderer ──────────────────────────────────────── */
function EddyMarkdown({text}){
  const lines=text.split("\n");
  const blocks=[];let i=0;
  while(i<lines.length){
    const ln=lines[i];
    // code fence
    if(/^```/.test(ln.trim())){
      const lang=ln.trim().slice(3).trim();const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){buf.push(lines[i]);i++;}
      i++;blocks.push({t:"code",lang,c:buf.join("\n")});continue;
    }
    // table
    if(ln.includes("|")&&i+1<lines.length&&/^\s*\|?[\s:-]+\|/.test(lines[i+1])&&lines[i+1].includes("-")){
      const head=ln.split("|").map(s=>s.trim()).filter(Boolean);i+=2;const rows=[];
      while(i<lines.length&&lines[i].includes("|")){rows.push(lines[i].split("|").map(s=>s.trim()).filter((s,idx,a)=>!(idx===0&&s==="")&&!(idx===a.length-1&&s===""))); i++;}
      blocks.push({t:"table",head,rows});continue;
    }
    // heading
    const h=/^(#{1,3})\s+(.*)/.exec(ln);
    if(h){blocks.push({t:"h",lvl:h[1].length,c:h[2]});i++;continue;}
    // blockquote
    if(/^>\s?/.test(ln)){const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,""));i++;}blocks.push({t:"quote",c:buf.join(" ")});continue;}
    // unordered list
    if(/^\s*[-*]\s+/.test(ln)){const items=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}blocks.push({t:"ul",items});continue;}
    // ordered list
    if(/^\s*\d+\.\s+/.test(ln)){const items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;}blocks.push({t:"ol",items});continue;}
    // blank
    if(ln.trim()===""){i++;continue;}
    // paragraph
    const buf=[ln];i++;
    while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,3}\s|>|\s*[-*]\s|\s*\d+\.\s|```)/.test(lines[i])&&!(lines[i].includes("|")&&i+1<lines.length&&/^\s*\|?[\s:-]+\|/.test(lines[i+1]||""))){buf.push(lines[i]);i++;}
    blocks.push({t:"p",c:buf.join(" ")});
  }
  return(
    <div style={{fontSize:13.5,lineHeight:1.65,color:T.txt}}>
      {blocks.map((b,bi)=>{
        if(b.t==="code")return <EddyCode key={bi} code={b.c} lang={b.lang}/>;
        if(b.t==="h")return React.createElement("div",{key:bi,style:{fontWeight:700,fontFamily:"Manrope",color:T.txt,margin:bi?"12px 0 6px":"0 0 6px",fontSize:b.lvl===1?17:b.lvl===2?15.5:14}},eddyInline(b.c,"h"+bi));
        if(b.t==="quote")return <div key={bi} style={{borderLeft:`3px solid ${T.p}`,background:T.pLt+"88",padding:"8px 12px",borderRadius:"0 8px 8px 0",margin:"8px 0",fontStyle:"italic",color:T.txt}}>{eddyInline(b.c,"q"+bi)}</div>;
        if(b.t==="ul")return <ul key={bi} style={{margin:"6px 0",paddingLeft:20,display:"flex",flexDirection:"column",gap:4}}>{b.items.map((it,ii)=><li key={ii} style={{lineHeight:1.6}}>{eddyInline(it,"u"+bi+ii)}</li>)}</ul>;
        if(b.t==="ol")return <ol key={bi} style={{margin:"6px 0",paddingLeft:20,display:"flex",flexDirection:"column",gap:4}}>{b.items.map((it,ii)=><li key={ii} style={{lineHeight:1.6}}>{eddyInline(it,"o"+bi+ii)}</li>)}</ol>;
        if(b.t==="table")return(
          <div key={bi} style={{overflowX:"auto",margin:"10px 0",border:`1px solid ${T.bdr}`,borderRadius:10}}>
            <table style={{borderCollapse:"collapse",width:"100%",fontSize:12.5}}>
              <thead><tr>{b.head.map((h,hi)=><th key={hi} style={{textAlign:"left",padding:"8px 12px",background:T.pLt,color:T.pDk,fontWeight:700,borderBottom:`1px solid ${T.bdr}`,whiteSpace:"nowrap"}}>{eddyInline(h,"th"+hi)}</th>)}</tr></thead>
              <tbody>{b.rows.map((r,ri)=><tr key={ri} style={{background:ri%2?T.bg:T.sur}}>{r.map((c,ci)=><td key={ci} style={{padding:"8px 12px",borderBottom:ri<b.rows.length-1?`1px solid ${T.bdr}`:"none",color:T.txt}}>{eddyInline(c,"td"+ri+ci)}</td>)}</tr>)}</tbody>
            </table>
          </div>
        );
        return React.createElement("p",{key:bi,style:{margin:bi?"7px 0 0":0}},eddyInline(b.c,"p"+bi));
      })}
    </div>
  );
}

  }
  if(/flashcard/.test(p)){
    return "Here are 4 flashcards for **"+T0+"** — cover the answer and test yourself:\n\n"+
    "**Q1.** What is the core definition?\n> The essential idea, stated simply.\n\n"+
    "**Q2.** Name one real-world use.\n> A practical application you'll recognise.\n\n"+
    "**Q3.** What's the common mistake?\n> The trap most students fall into.\n\n"+
    "Want me to turn these into a downloadable set?";
  }
  if(/real.?life|real.?world|example of use|application/.test(p)){
    return "Great question! **"+T0+"** shows up in daily life more than you'd think:\n\n- **At home** — an everyday scenario where the idea applies\n- **In tech** — how apps and systems use it under the hood\n- **In nature** — a natural process that mirrors the concept\n\nWhich of these would you like me to unpack further?";
  }
  if(/simpl|beginner|eli5|easy/.test(p)){
    return "Let's keep **"+T0+"** super simple 🙂\n\nImagine you're explaining it to a friend with a quick analogy — that's the heart of it. The technical terms are just labels for ideas you already understand intuitively.\n\n**The one thing to remember:** start from the basics, build up one step at a time, and don't skip the *why*.";
  }
  // default explanation — rich, shows off everything
  return "### "+T0+"\n\n"+
  "Happy to explain! Here's a clear breakdown:\n\n"+
  "**The big idea:** "+T0+" connects a few simple concepts into something powerful once you see how the pieces fit together.\n\n"+
  "**Key points**\n1. Start with the core definition\n2. Understand the main method\n3. Practise with a worked example\n\n"+
  "A useful relationship to keep in mind: $C = 0.4T + 0.6X$\n\n"+
  "> Learning tip: explain it back in your own words — teaching is the fastest way to learn.\n\n"+
  "Want me to **go deeper**, **give examples**, or **quiz you** on it?";
}

function eddyFileIc(name){
  const e=(name.split(".").pop()||"").toLowerCase();
