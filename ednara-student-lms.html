/* ── EddyQuiz component ────────────────────────────────────────────────── */
function EddyQuiz({onExit,mob}){
  const [step,setStep]=useState("subject");   // subject | topic | generating | quiz | done
  const [subject,setSubject]=useState(null);
  const [topicName,setTopicName]=useState(null);
  const [questions,setQuestions]=useState([]);
  const [qIdx,setQIdx]=useState(0);
  const [selected,setSelected]=useState(null); // index of selected option
  const [answered,setAnswered]=useState(false);
  const [results,setResults]=useState([]);     // array of {correct:bool}
  const [genStep,setGenStep]=useState(0);      // 0-4 generating animation steps
  const scrollRef=useRef(null);
  const genRef=useRef(null);

  useEffect(()=>{const el=scrollRef.current;if(el)el.scrollTop=el.scrollHeight;},[step,qIdx,answered,genStep]);

  const subjects=Object.keys(EDDY_QUIZ_BANK);

  function pickSubject(s){setSubject(s);setStep("topic");}
  function pickTopic(t){
    setTopicName(t);
    // pick 5 random questions
    const pool=[...EDDY_QUIZ_BANK[subject][t]];
    const picked=[];
    while(picked.length<5&&pool.length>0){
      const i=Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(i,1)[0]);
    }
    setQuestions(picked);setQIdx(0);setSelected(null);setAnswered(false);setResults([]);
    // Start generating animation
    setGenStep(0);setStep("generating");
    clearInterval(genRef.current);
    let gs=0;
    genRef.current=setInterval(()=>{
      gs++;
      setGenStep(gs);
      if(gs>=5){clearInterval(genRef.current);setTimeout(()=>setStep("quiz"),400);}
    },550);
  }
  function selectOption(i){
    if(answered)return;
    setSelected(i);setAnswered(true);
    const correct=i===questions[qIdx].ans;
    setResults(r=>[...r,{correct}]);
  }
  function next(){
    if(qIdx<questions.length-1){setQIdx(qIdx+1);setSelected(null);setAnswered(false);}
    else setStep("done");
  }
  function restart(){clearInterval(genRef.current);setStep("subject");setSubject(null);setTopicName(null);setQuestions([]);setQIdx(0);setSelected(null);setAnswered(false);setResults([]);setGenStep(0);}

  const score=results.filter(r=>r.correct).length;
  const btnBase={border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:600,borderRadius:10,display:"flex",alignItems:"center",gap:7,justifyContent:"center"};

  return(
    <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:mob?14:16,display:"flex",flexDirection:"column",gap:0}}>

      {/* ── Subject selection ── */}
      {step==="subject"&&(
        <div className="fu" style={{display:"flex",flexDirection:"column",gap:14,paddingTop:4}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}>
            <div style={{width:36,height:36,borderRadius:10,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Ic n="quiz" sz={20} color={T.p} fill={1}/>
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:T.txt,fontFamily:"Manrope"}}>Quick Quiz</div>
              <div style={{fontSize:12,color:T.muted}}>Pick a subject to start</div>
            </div>
          </div>
          {subjects.map(s=>(
            <button key={s} onClick={()=>pickSubject(s)}
              style={{...btnBase,background:T.sur,border:`1.5px solid ${T.bdr}`,padding:"14px 16px",fontSize:14,color:T.txt,textAlign:"left",justifyContent:"space-between"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=T.p;e.currentTarget.style.background=T.pLt+"66";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.background=T.sur;}}>
              <span>{s}</span>
              <Ic n="chevron_right" sz={18} color={T.muted}/>
            </button>
          ))}
          <button onClick={onExit} style={{...btnBase,background:"transparent",color:T.muted,padding:"8px",fontSize:13,marginTop:4,justifyContent:"center"}}>
            <Ic n="arrow_back" sz={15} color={T.muted}/>Back to chat
          </button>
        </div>
      )}

      {/* ── Topic selection ── */}
      {step==="topic"&&(
        <div className="fu" style={{display:"flex",flexDirection:"column",gap:14,paddingTop:4}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}>
            <div style={{width:36,height:36,borderRadius:10,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Ic n="quiz" sz={20} color={T.p} fill={1}/>
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:T.txt,fontFamily:"Manrope"}}>{subject}</div>
              <div style={{fontSize:12,color:T.muted}}>Choose a topic</div>
            </div>
          </div>
          {Object.keys(EDDY_QUIZ_BANK[subject]).map(t=>(
            <button key={t} onClick={()=>pickTopic(t)}
              style={{...btnBase,background:T.sur,border:`1.5px solid ${T.bdr}`,padding:"14px 16px",fontSize:14,color:T.txt,textAlign:"left",justifyContent:"space-between"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=T.p;e.currentTarget.style.background=T.pLt+"66";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.background=T.sur;}}>
              <span>{t}</span>
              <span style={{fontSize:11,color:T.muted,fontWeight:400}}>{EDDY_QUIZ_BANK[subject][t].length} Qs</span>
            </button>
          ))}
          <button onClick={()=>setStep("subject")} style={{...btnBase,background:"transparent",color:T.muted,padding:"8px",fontSize:13,marginTop:4,justifyContent:"center"}}>
            <Ic n="arrow_back" sz={15} color={T.muted}/>Change subject
          </button>
        </div>
      )}

      {/* ── Generating animation ── */}
      {step==="generating"&&(
        <div className="fu" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20,paddingTop:32}}>
          {/* Animated brain/sparkle icon */}
          <div style={{position:"relative",width:80,height:80}}>
            {/* Outer ring pulse */}
            <div style={{position:"absolute",inset:0,borderRadius:"50%",border:`2.5px solid ${T.p}33`,
              animation:"eddyring 1.4s ease-out infinite"}}/>
            <div style={{position:"absolute",inset:0,borderRadius:"50%",border:`2.5px solid ${T.pMd}33`,
              animation:"eddyring 1.4s ease-out infinite",animationDelay:".7s"}}/>
            {/* Center circle */}
            <div style={{position:"absolute",inset:8,borderRadius:"50%",
              background:`linear-gradient(135deg,${T.pDk},${T.p},${T.pMd})`,
              display:"flex",alignItems:"center",justifyContent:"center",
              boxShadow:`0 6px 24px ${T.p}44`,animation:"eddyfloat 2s ease-in-out infinite"}}>
              <Ic n="auto_awesome" sz={28} color="#fff" fill={1}/>
            </div>
          </div>

          {/* Title */}
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:800,color:T.txt,fontFamily:"Manrope",marginBottom:4}}>Generating your quiz</div>
            <div style={{fontSize:12.5,color:T.muted}}>{topicName} · {subject}</div>
          </div>

          {/* Step-by-step progress */}
          <div style={{width:"100%",maxWidth:280,display:"flex",flexDirection:"column",gap:0}}>
            {[
              ["search","Scanning question bank"],
              ["psychology","Picking difficulty level"],
              ["shuffle","Randomizing 5 questions"],
              ["tune","Preparing answer options"],
              ["check_circle","Quiz ready!"],
            ].map(([ic,label],i)=>{
              const done=genStep>i;
              const active=genStep===i;
              return(
                <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",
                  opacity:genStep>=i?1:0,transform:genStep>=i?"translateY(0)":"translateY(8px)",
                  transition:"opacity .3s ease,transform .3s ease"}}>
                  {/* Icon */}
                  <div style={{width:32,height:32,borderRadius:9,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                    background:done?T.ok:active?T.p:T.bdr,
                    transition:"background .3s ease",
                    ...(active?{boxShadow:`0 0 0 3px ${T.p}22`}:{})}}>
                    {done
                      ?<Ic n="check" sz={16} color="#fff" wght={600}/>
                      :active
                        ?<Ic n={ic} sz={16} color="#fff" fill={1} style={{animation:"pulse 1s ease-in-out infinite"}}/>
                        :<Ic n={ic} sz={16} color={T.muted}/>
                    }
                  </div>
                  {/* Label */}
                  <span style={{fontSize:13,fontWeight:done||active?600:400,
                    color:done?T.ok:active?T.txt:T.muted,
                    transition:"color .3s ease"}}>
                    {label}
                  </span>
                  {/* Active spinner dot */}
                  {active&&!done&&(
                    <div style={{marginLeft:"auto",display:"flex",gap:3}}>
                      {[0,1,2].map(d=>(
                        <div key={d} style={{width:4,height:4,borderRadius:"50%",background:T.p,
                          animation:"eddydot 1s ease-in-out infinite",animationDelay:`${d*.15}s`}}/>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Bottom progress bar */}
          <div style={{width:"100%",maxWidth:280}}>
            <div style={{height:4,borderRadius:99,background:T.bdr,overflow:"hidden"}}>
              <div style={{width:`${(genStep/5)*100}%`,height:"100%",borderRadius:99,
                background:`linear-gradient(90deg,${T.p},${T.pMd})`,
                transition:"width .4s ease"}}/>
            </div>
          </div>
        </div>
      )}

      {/* ── Quiz questions ── */}
      {step==="quiz"&&questions.length>0&&(
        <div className="fu" style={{display:"flex",flexDirection:"column",gap:16,paddingTop:4}}>
          {/* Progress */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1,height:5,borderRadius:99,background:T.bdr,overflow:"hidden"}}>
              <div style={{width:`${((qIdx+(answered?1:0))/questions.length)*100}%`,height:"100%",background:T.p,borderRadius:99,transition:"width .35s ease"}}/>
            </div>
            <span style={{fontSize:12,fontWeight:700,color:T.muted,fontFamily:"Manrope",flexShrink:0}}>
              {qIdx+1}/{questions.length}
            </span>
          </div>

          {/* Topic badge */}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,fontWeight:600,color:T.p,background:T.pLt,padding:"3px 10px",borderRadius:99}}>{subject}</span>
            <span style={{fontSize:11,color:T.muted}}>{topicName}</span>
          </div>

          {/* Question */}
          <div style={{fontSize:15,fontWeight:700,color:T.txt,fontFamily:"Manrope",lineHeight:1.5}}>
            {questions[qIdx].q}
          </div>

          {/* Options */}
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {questions[qIdx].opts.map((opt,i)=>{
              const isCorrect=i===questions[qIdx].ans;
              const isSelected=i===selected;
              let bg=T.sur, bdr=T.bdr, col=T.txt, icon=null;
              if(answered){
                if(isCorrect){bg=T.okBg;bdr=T.ok;col=T.ok;icon="check_circle";}
                else if(isSelected&&!isCorrect){bg=T.errBg;bdr=T.err;col=T.err;icon="cancel";}
                else{bg=T.bg;bdr=T.bdr;col=T.muted;}
              }
              return(
                <button key={i} onClick={()=>selectOption(i)} disabled={answered}
                  style={{...btnBase,background:bg,border:`1.5px solid ${bdr}`,padding:"13px 15px",fontSize:13.5,color:col,
                    textAlign:"left",justifyContent:"flex-start",gap:10,cursor:answered?"default":"pointer",
                    transition:"all .2s ease",opacity:answered&&!isCorrect&&!isSelected?.55:1}}
                  onMouseEnter={e=>{if(!answered){e.currentTarget.style.borderColor=T.p;e.currentTarget.style.background=T.pLt+"55";}}}
                  onMouseLeave={e=>{if(!answered){e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.background=T.sur;}}}>
                  {/* Option letter */}
                  <span style={{width:26,height:26,borderRadius:8,
                    background:answered?(isCorrect?T.ok:isSelected?T.err:T.bdr):T.pLt,
                    color:answered?(isCorrect||isSelected?"#fff":T.muted):T.p,
                    fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {String.fromCharCode(65+i)}
                  </span>
                  <span style={{flex:1}}>{opt}</span>
                  {answered&&icon&&<Ic n={icon} sz={20} color={col} fill={1}/>}
                </button>
              );
            })}
          </div>

          {/* Feedback + Next */}
          {answered&&(
            <div className="fu" style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{padding:"12px 14px",borderRadius:11,
                background:results[results.length-1].correct?T.okBg:T.errBg,
                border:`1px solid ${results[results.length-1].correct?T.ok:T.err}33`}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2}}>
                  <Ic n={results[results.length-1].correct?"emoji_events":"close"} sz={17}
                    color={results[results.length-1].correct?T.ok:T.err} fill={1}/>
                  <span style={{fontSize:14,fontWeight:700,color:results[results.length-1].correct?T.ok:T.err,fontFamily:"Manrope"}}>
                    {results[results.length-1].correct?"Correct!":"Incorrect"}
                  </span>
                </div>
                {!results[results.length-1].correct&&(
                  <div style={{fontSize:13,color:T.txt,marginTop:4,lineHeight:1.5}}>
                    The correct answer is: <strong style={{color:T.ok}}>{questions[qIdx].opts[questions[qIdx].ans]}</strong>
                  </div>
                )}
              </div>
              <button onClick={next}
                style={{...btnBase,background:T.p,color:"#fff",padding:"11px 24px",fontSize:14,boxShadow:"0 1px 3px rgba(107,47,167,.25)",alignSelf:"stretch"}}>
                {qIdx<questions.length-1?"Next Question":"See Results"}
                <Ic n={qIdx<questions.length-1?"arrow_forward":"bar_chart"} sz={17} color="#fff"/>
              </button>
            </div>
          )}
        </div>
      )}

      {/* ── Results ── */}
      {step==="done"&&(
        <div className="fu" style={{display:"flex",flexDirection:"column",gap:18,paddingTop:8,alignItems:"center",textAlign:"center"}}>
          {/* Score circle */}
          <div style={{position:"relative",width:100,height:100}}>
            <svg viewBox="0 0 100 100" style={{width:100,height:100,transform:"rotate(-90deg)"}}>
              <circle cx="50" cy="50" r="42" fill="none" stroke={T.bdr} strokeWidth="7"/>
              <circle cx="50" cy="50" r="42" fill="none"
                stroke={score>=4?T.ok:score>=3?T.warn:T.err} strokeWidth="7"
                strokeDasharray={`${(score/5)*264} 264`}
                strokeLinecap="round" style={{transition:"stroke-dasharray .6s ease"}}/>
            </svg>
            <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:28,fontWeight:800,color:T.txt,fontFamily:"Manrope",lineHeight:1}}>{score}</span>
              <span style={{fontSize:11,color:T.muted}}>out of 5</span>
            </div>
          </div>

          <div>
            <div style={{fontSize:18,fontWeight:800,color:T.txt,fontFamily:"Manrope",marginBottom:4}}>
              {score===5?"Perfect Score! 🎉":score>=4?"Great Job! 🌟":score>=3?"Good Effort! 👍":"Keep Practicing 💪"}
            </div>
            <div style={{fontSize:13,color:T.muted}}>{topicName} · {subject}</div>
          </div>

          {/* Per-question breakdown */}
          <div style={{width:"100%",display:"flex",flexDirection:"column",gap:6,textAlign:"left"}}>
            {questions.map((qn,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",
                background:results[i].correct?T.okBg:T.errBg,border:`1px solid ${results[i].correct?T.ok:T.err}22`,borderRadius:10}}>
                <Ic n={results[i].correct?"check_circle":"cancel"} sz={18} color={results[i].correct?T.ok:T.err} fill={1}/>
                <span style={{flex:1,fontSize:12.5,color:T.txt,lineHeight:1.4}}>{qn.q.length>65?qn.q.slice(0,62)+"…":qn.q}</span>
              </div>
            ))}
          </div>

          {/* Actions */}
          <div style={{display:"flex",gap:10,width:"100%"}}>
            <button onClick={restart}
              style={{...btnBase,flex:1,background:T.pLt,color:T.p,padding:"11px 16px",fontSize:13}}>
              <Ic n="refresh" sz={16} color={T.p}/>New Quiz
            </button>
            <button onClick={onExit}
              style={{...btnBase,flex:1,background:T.p,color:"#fff",padding:"11px 16px",fontSize:13,boxShadow:"0 1px 3px rgba(107,47,167,.25)"}}>
              <Ic n="chat" sz={16} color="#fff"/>Back to Chat
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Eddy main component ────────────────────────────────────────────────── */
function Eddy({topic,hidden,mob}){
  const [open,setOpen]=useState(false);
  const [view,setView]=useState("chat");        // chat | history | quiz
  const [unread,setUnread]=useState(1);
  const [msgs,setMsgs]=useState([]);
  const [history,setHistory]=useState(EDDY_SEED);
  const [input,setInput]=useState("");
  const [attach,setAttach]=useState([]);
  const [streaming,setStreaming]=useState(false);
  const [listening,setListening]=useState(false);
  const scrollRef=useRef(null),streamRef=useRef(null),recRef=useRef(null),fileRef=useRef(null),taRef=useRef(null);

  // autoscroll
  useEffect(()=>{const el=scrollRef.current;if(el)el.scrollTop=el.scrollHeight;},[msgs,streaming,open,view]);
  // escape closes; clear unread on open
  useEffect(()=>{
    if(!open)return;setUnread(0);
    const onKey=e=>{if(e.key==="Escape"){e.stopPropagation();setOpen(false);}};
    document.addEventListener("keydown",onKey);
    return()=>document.removeEventListener("keydown",onKey);
  },[open]);
  // stop everything if forced hidden (e.g. exam started)
  useEffect(()=>{if(hidden){setOpen(false);stopVoice();clearInterval(streamRef.current);}},[hidden]);

  const contextual=topic&&topic!=="this topic";
  const suggestChips=contextual
    ?["Explain "+topic,"Create revision notes","Give MCQs","Explain with examples","Simplify for beginners"]
    :["Explain today's lesson","Help me revise","Summarize this PDF","Quiz me","Explain this topic simply","Give real-life examples"];

  function stopVoice(){try{recRef.current&&recRef.current.stop&&recRef.current.stop();}catch(e){}recRef.current=null;setListening(false);}
  function toggleVoice(){
    if(listening){stopVoice();return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    setListening(true);
    if(SR){
      try{
        const r=new SR();r.lang="en-US";r.interimResults=true;r.continuous=false;
        r.onresult=e=>{const txt=Array.from(e.results).map(x=>x[0].transcript).join("");setInput(txt);};
        r.onend=()=>setListening(false);r.onerror=()=>setListening(false);
        recRef.current=r;r.start();
      }catch(e){simulateVoice();}
    }else simulateVoice();
  }
  function simulateVoice(){
    const demo=contextual?("Explain "+topic+" with a simple example"):"Summarize today's lesson for me";
    let i=0;const iv=setInterval(()=>{i+=2;setInput(demo.slice(0,i));if(i>=demo.length){clearInterval(iv);setTimeout(()=>setListening(false),450);}},42);
    recRef.current={stop:()=>{clearInterval(iv);setInput("");}};
  }

  function streamReply(userText,files){
    const full=eddyGenerate(userText,topic,files);
    const eid=eddyUid();
    setMsgs(m=>[...m,{id:eid,role:"eddy",content:""}]);
    setStreaming(true);
    clearInterval(streamRef.current);
    let i=0;
    // brief "thinking" pause then stream
    setTimeout(()=>{
      streamRef.current=setInterval(()=>{
        i+=Math.max(2,Math.round(full.length/90));
        const slice=full.slice(0,i);
        setMsgs(m=>m.map(x=>x.id===eid?{...x,content:slice}:x));
        if(i>=full.length){clearInterval(streamRef.current);setStreaming(false);setMsgs(m=>m.map(x=>x.id===eid?{...x,content:full}:x));}
      },16);
    },550);
  }

  function send(text){
    const t=(text!==undefined?text:input).trim();
    if((!t&&attach.length===0)||streaming)return;
    // Intercept quiz-related messages
    const tl=t.toLowerCase();
    if(tl==="quiz me"||tl==="give mcqs"||tl==="give me mcqs"||tl==="start quiz"||tl==="take a quiz"){
      setInput("");setView("quiz");return;
    }
    const files=attach.slice();
    setMsgs(m=>[...m,{id:eddyUid(),role:"user",content:t,files}]);
    setInput("");setAttach([]);setView("chat");
    if(taRef.current)taRef.current.style.height="auto";
    streamReply(t,files);
  }
  function regen(){
    // find last user message
    let lastUser=null;for(let k=msgs.length-1;k>=0;k--){if(msgs[k].role==="user"){lastUser=msgs[k];break;}}
    if(!lastUser||streaming)return;
    // drop trailing eddy msg
    setMsgs(m=>{const c=m.slice();if(c.length&&c[c.length-1].role==="eddy")c.pop();return c;});
    setTimeout(()=>streamReply(lastUser.content,lastUser.files),40);
  }
  function toggleLike(id,val){setMsgs(m=>m.map(x=>x.id===id?{...x,liked:val==="l"?!x.liked:x.liked,disliked:val==="d"?!x.disliked:x.disliked,...(val==="l"&&!x.liked?{disliked:false}:{}),...(val==="d"&&!x.disliked?{liked:false}:{})}:x));}
  function copy(txt){try{navigator.clipboard.writeText(txt);}catch(e){}}

  function newChat(){
    if(msgs.length){const first=msgs.find(x=>x.role==="user");setHistory(h=>[{id:eddyUid(),title:first?first.content.slice(0,42):"New chat",ts:"Just now",msgs},...h]);}
    setMsgs([]);setView("chat");setInput("");setAttach([]);
  }
  function loadConv(c){setMsgs(c.msgs);setHistory(h=>h.filter(x=>x.id!==c.id));setView("chat");}
  function delConv(id){setHistory(h=>h.filter(x=>x.id!==id));}

  function onFiles(e){
    const list=Array.from(e.target.files||[]).map(f=>({name:f.name,size:f.size}));
    setAttach(a=>[...a,...list]);e.target.value="";
  }
  function chipAction(c){
    if(c==="Upload a document"){fileRef.current&&fileRef.current.click();return;}
    if(c==="Start voice chat"){setView("chat");toggleVoice();return;}
    if(c==="Ask a question"){setView("chat");taRef.current&&taRef.current.focus();return;}
    if(c==="Explain this topic")return send(contextual?"Explain "+topic:"Explain today's lesson");
    if(c==="Summarize lesson")return send(contextual?"Summarize "+topic:"Summarize today's lesson");
    if(c==="Quiz me"||c==="Give MCQs"){setView("quiz");return;}
    send(c);
  }

  if(hidden)return null;   // stays mounted via parent; simply renders nothing during assessments

  const PANEL_W=mob?"100%":410;
  return(
    <React.Fragment>
      <EddyLauncher onClick={()=>setOpen(true)} unread={unread} mob={mob} open={open}/>
      <input ref={fileRef} type="file" multiple onChange={onFiles} aria-hidden="true"
        accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.md,image/*" style={{display:"none"}}/>

      {open&&(
        <React.Fragment>
          {mob&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:8999}}/>}
          <section role="dialog" aria-label="Eddy AI learning assistant" aria-modal={mob?"true":"false"}
            style={{position:"fixed",top:0,right:0,bottom:0,width:PANEL_W,maxWidth:"100vw",zIndex:9001,
              background:T.bg,display:"flex",flexDirection:"column",boxShadow:"-8px 0 40px rgba(30,20,60,.18)",
              animation:"eddyslide .28s cubic-bezier(.4,0,.2,1)",borderLeft:`1px solid ${T.bdr}`}}>

            {/* Header */}
            <header style={{background:`linear-gradient(135deg,${T.pDk},${T.p} 60%,${T.pMd})`,padding:mob?"12px 14px":"14px 16px",display:"flex",alignItems:"center",gap:11,flexShrink:0}}>
              <div style={{position:"relative"}}>
                <img src={EDDY_AVATAR} alt="Eddy" style={{width:38,height:38,borderRadius:11,objectFit:"cover",border:"2px solid rgba(255,255,255,.35)"}}/>
                <span style={{position:"absolute",bottom:-1,right:-1,width:11,height:11,borderRadius:"50%",background:"#4ADE80",border:"2px solid #fff"}}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontWeight:700,fontSize:16,color:"#fff",fontFamily:"Manrope"}}>Eddy</span>
                  <span style={{fontSize:10,fontWeight:600,color:"#fff",background:"rgba(255,255,255,.2)",padding:"1px 7px",borderRadius:99}}>AI</span>
                </div>
                <div style={{fontSize:11.5,color:"rgba(255,255,255,.85)",display:"flex",alignItems:"center",gap:4}}>
                  {view==="history"?"Chat history":view==="quiz"?<React.Fragment><Ic n="quiz" sz={12} color="#4ADE80" fill={1} style={{marginRight:2}}/>Quiz mode</React.Fragment>:<React.Fragment><span style={{width:6,height:6,borderRadius:"50%",background:"#4ADE80",display:"inline-block"}}/>Online · Learning companion</React.Fragment>}
                </div>
              </div>
              {[["View chat history",view==="history"?"chat":"history",()=>setView(view==="history"?"chat":"history")],
                ["New chat","add_comment",newChat],
                ["Close",mob?"close":"chevron_right",()=>setOpen(false)]].map(([lbl,ic,fn],i)=>(
                <button key={i} onClick={fn} aria-label={lbl} title={lbl}
                  style={{width:34,height:34,borderRadius:9,border:"none",background:"rgba(255,255,255,.14)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.26)"} onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.14)"}>
                  <Ic n={ic} sz={18} color="#fff"/>
                </button>
              ))}
            </header>

            {/* Context indicator */}
            {contextual&&view==="chat"&&(
              <div style={{padding:"7px 14px",background:T.pLt+"88",borderBottom:`1px solid ${T.bdr}`,display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <Ic n="auto_awesome" sz={14} color={T.p} fill={1}/>
                <span style={{fontSize:11.5,color:T.pDk,fontWeight:600}}>Context:</span>
                <span style={{fontSize:11.5,color:T.txt,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{topic}</span>
              </div>
            )}

            {/* ── History view ── */}
            {view==="history"?(
              <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:mob?14:16}}>
                {history.length===0?(
                  <div style={{textAlign:"center",padding:"48px 20px",color:T.muted}}>
                    <img src={EDDY_AVATAR} alt="" style={{width:64,height:64,borderRadius:18,objectFit:"cover",opacity:.85,marginBottom:14}}/>
                    <div style={{fontWeight:700,fontSize:15,color:T.txt,fontFamily:"Manrope",marginBottom:4}}>No conversations yet</div>
                    <div style={{fontSize:13,marginBottom:18}}>Start a new chat and it'll appear here.</div>
                    <Btn size="sm" onClick={()=>setView("chat")}><Ic n="add" sz={15} color="#fff"/>New chat</Btn>
                  </div>
                ):(
                  <div style={{display:"flex",flexDirection:"column",gap:9}}>
                    {history.map(c=>(
                      <div key={c.id} onClick={()=>loadConv(c)} role="button" tabIndex={0}
                        onKeyDown={e=>{if(e.key==="Enter")loadConv(c);}}
                        style={{background:T.sur,border:`1px solid ${T.bdr}`,borderRadius:12,padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:11}}
                        onMouseEnter={e=>e.currentTarget.style.borderColor=T.p+"66"} onMouseLeave={e=>e.currentTarget.style.borderColor=T.bdr}>
                        <div style={{width:34,height:34,borderRadius:9,background:T.pLt,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          <Ic n="chat_bubble" sz={17} color={T.p} fill={1}/>
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:13.5,color:T.txt,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</div>
                          <div style={{fontSize:11.5,color:T.muted}}>{c.ts} · {c.msgs.length} messages</div>
                        </div>
                        <button onClick={e=>{e.stopPropagation();delConv(c.id);}} aria-label="Delete conversation"
                          style={{background:"transparent",border:"none",cursor:"pointer",padding:6,borderRadius:7,display:"flex",flexShrink:0}}
                          onMouseEnter={e=>e.currentTarget.style.background=T.errBg} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <Ic n="delete" sz={16} color={T.muted}/>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ):view==="quiz"?(
              <EddyQuiz onExit={()=>setView("chat")} mob={mob}/>
            ):(
              /* ── Chat / welcome view ── */
              <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:mob?14:16,display:"flex",flexDirection:"column",gap:14}}>
                {msgs.length===0?(
                  <div className="fu" style={{display:"flex",flexDirection:"column",gap:18,paddingTop:8}}>
                    {/* Welcome — compact */}
                    <div style={{textAlign:"center"}}>
                      <img src={EDDY_AVATAR} alt="Eddy" style={{width:56,height:56,borderRadius:16,objectFit:"cover",border:`2px solid ${T.bdr}`,boxShadow:"0 4px 14px rgba(107,47,167,.14)"}}/>
                      <h2 style={{margin:"10px 0 2px",fontSize:17,fontWeight:800,color:T.txt,fontFamily:"Manrope"}}>Hi! I'm Eddy</h2>
                      <p style={{fontSize:12.5,color:T.muted,margin:0,lineHeight:1.5}}>
                        {contextual?`Ask me anything about ${topic}`:"Your AI study companion \u2014 ask me anything"}
                      </p>
                    </div>
                    {/* Suggested prompts */}
                    <div style={{display:"flex",flexDirection:"column",gap:7}}>
                      {suggestChips.slice(0,4).map((c,i)=>(
                        <button key={i} onClick={()=>send(c)} style={{textAlign:"left",display:"flex",alignItems:"center",gap:9,background:T.sur,border:`1px solid ${T.bdr}`,borderRadius:11,padding:"11px 13px",fontSize:13,color:T.txt,cursor:"pointer",fontFamily:"inherit",fontWeight:500}}
                          onMouseEnter={e=>{e.currentTarget.style.borderColor=T.p+"66";e.currentTarget.style.background=T.pLt+"55";}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.background=T.sur;}}>
                          <Ic n="arrow_outward" sz={15} color={T.p}/>{c}
                        </button>
                      ))}
                    </div>
                  </div>
                ):(
                  msgs.map((m,i)=><EddyMsg key={m.id} m={m} streaming={streaming&&i===msgs.length-1&&m.role==="eddy"} onCopy={copy} onRegen={regen} onLike={()=>toggleLike(m.id,"l")} onDislike={()=>toggleLike(m.id,"d")}/>)
                )}
              </div>
            )}

            {/* ── Input area ── */}
            {view==="chat"&&(
              <div style={{flexShrink:0,borderTop:`1px solid ${T.bdr}`,background:T.sur,padding:mob?"10px 12px":"12px 14px"}}>
                {/* Pending attachments */}
                {attach.length>0&&(
                  <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:9}}>
                    {attach.map((f,i)=><EddyFileCard key={i} f={f} onRemove={()=>setAttach(a=>a.filter((_,x)=>x!==i))}/>)}
                  </div>
                )}
                {/* Listening banner */}
                {listening?(
                  <div style={{display:"flex",alignItems:"center",gap:11,background:`linear-gradient(135deg,${T.p},${T.pMd})`,borderRadius:14,padding:"12px 15px"}}>
                    <EddyWave/>
                    <div style={{flex:1,color:"#fff"}}>
                      <div style={{fontSize:13,fontWeight:700}}>Listening…</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,.85)"}}>Tap the mic to stop</div>
                    </div>
                    <button onClick={toggleVoice} aria-label="Stop listening" style={{width:38,height:38,borderRadius:"50%",border:"none",background:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      <Ic n="stop" sz={20} color={T.p} fill={1}/>
                    </button>
                  </div>
                ):(
                  <div style={{display:"flex",alignItems:"flex-end",gap:8,background:T.bg,border:`1.5px solid ${T.bdr}`,borderRadius:14,padding:"6px 6px 6px 8px"}}>
                    <button onClick={()=>fileRef.current&&fileRef.current.click()} aria-label="Attach a file" title="Attach file"
                      style={{width:34,height:34,borderRadius:9,border:"none",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}
                      onMouseEnter={e=>e.currentTarget.style.background=T.pLt} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <Ic n="attach_file" sz={19} color={T.muted}/>
                    </button>
                    <textarea ref={taRef} value={input} rows={1} placeholder="Ask Eddy anything…"
                      aria-label="Message Eddy"
                      onChange={e=>{setInput(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";}}
                      onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
                      style={{flex:1,resize:"none",border:"none",background:"transparent",fontSize:13.5,lineHeight:1.5,color:T.txt,fontFamily:"inherit",padding:"7px 2px",maxHeight:120,outline:"none"}}/>
                    <button onClick={toggleVoice} aria-label="Start voice chat" title="Voice"
                      style={{width:34,height:34,borderRadius:9,border:"none",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}
                      onMouseEnter={e=>e.currentTarget.style.background=T.pLt} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <Ic n="mic" sz={19} color={T.muted}/>
                    </button>
                    <button onClick={()=>send()} disabled={(!input.trim()&&attach.length===0)||streaming} aria-label="Send message"
                      style={{width:38,height:38,borderRadius:11,border:"none",cursor:(!input.trim()&&attach.length===0)||streaming?"not-allowed":"pointer",flexShrink:0,
                        background:(!input.trim()&&attach.length===0)||streaming?"#E2E2E8":T.p,display:"flex",alignItems:"center",justifyContent:"center",transition:"background .15s"}}>
                      <Ic n="arrow_upward" sz={20} color={(!input.trim()&&attach.length===0)||streaming?"#9CA3AF":"#fff"}/>
                    </button>
                  </div>
                )}
                <div style={{fontSize:10.5,color:T.muted,textAlign:"center",marginTop:7}}>Eddy can make mistakes — verify important information.</div>
              </div>
            )}
          </section>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

/* ── App ─────────────────────────────────────────────────────────────────── */
const PAGE_TITLES={
  dashboard:"Dashboard",courses:"My Courses","course-detail":"My Courses",
  practice:"AI Practice","practice-setup":"Set Up Practice","practice-session":"Practice Session",
  tests:"Tests & Exams",exam:"Digital Systems Architecture",
  "exam-results":"Performance Report","live-classes":"Live Classes",assignments:"Assignments",
};

function App(){
  const mob=useIsMobile();
  const [page,setPage]=useState("login");
  // Remove splash once mounted
  useEffect(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';s.style.transition='opacity .3s';setTimeout(()=>s.remove(),300);};},[]);
  const [exp,setExp]=useState(true);
  const [mobSidebar,setMobSidebar]=useState(false);
  const [openCourse,setOpenCourse]=useState(null);
  const [practSub,setPractSub]=useState(null);
  const [viewReport,setViewReport]=useState(null);
  const [quizUnit,setQuizUnit]=useState(null);   // {id, title}
  const [signOutModal,setSignOutModal]=useState(false);
  const nav=useCallback(p=>{setPage(p);setMobSidebar(false);},[]);
  const{toasts,dismiss:dismissToast}=useToastStack();
  if(page==="login")return<LoginScreen onLogin={()=>setPage("dashboard")} mob={mob}/>;
  const isExam=page==="exam";
  return(
    <div style={{display:"flex",height:"100vh",background:T.bg,fontFamily:"'Sora',-apple-system,sans-serif"}}>
      {/* Fullscreen overlays (quiz) */}
      {quizUnit&&(
        <UnitQuizScreen
          unitId={quizUnit.id} unitTitle={quizUnit.title}
          onFinish={()=>setQuizUnit(null)}
          onExit={()=>setQuizUnit(null)}/>
      )}
            {!isExam&&!mob&&<Sidebar active={page} onNav={nav} exp={exp}/>}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
        {!isExam&&<TopBar title={PAGE_TITLES[page]||"Ednara"} onToggle={()=>setExp(!exp)} onNav={p=>p==="signout-confirm"?setSignOutModal(true):p==="login"?setPage("login"):nav(p)} mob={mob}/>}
        <main style={{flex:1,overflowY:page==="course-detail"||page==="exam"?"hidden":"auto",paddingBottom:mob&&!isExam?"64px":0}}>
          {page==="dashboard"         &&<DashboardScreen onNav={nav} mob={mob}/>}
          {page==="courses"           &&<CoursesScreen onOpen={c=>{setOpenCourse(c);nav("course-detail");}} mob={mob}/>}
          {page==="course-detail"     &&<CourseDetailScreen course={openCourse} onBack={()=>nav("courses")} onStartQuiz={(id,title)=>setQuizUnit({id,title})} mob={mob}/>}
          {page==="practice"          &&<PracticeScreen onStart={s=>{setPractSub(s);nav("practice-session");}} onSetup={()=>nav("practice-setup")} mob={mob}/>}
          {page==="practice-setup"    &&<PracticeSetupScreen onBack={()=>nav("practice")} onGenerate={s=>{setPractSub(s);nav("practice-session");}} mob={mob}/>}
          {page==="practice-session"  &&<PracticeSessionScreen subject={practSub} onBack={()=>nav("practice")} mob={mob} exp={exp}/>}
          {page==="tests"             &&<TestsScreen onStartExam={()=>nav("exam")} onViewReport={t=>{setViewReport(t);nav("exam-results");}} mob={mob}/>}
          {page==="exam"              &&<ExamScreen onSubmit={()=>{setViewReport(TESTS[0]);nav("exam-results");}} mob={mob}/>}
          {page==="exam-results"      &&<ExamResultsScreen test={viewReport} onBack={()=>nav("tests")} mob={mob}/>}
          {page==="live-classes"       &&<LiveClassesScreen mob={mob}/>}
          {page==="assignments"       &&<AssignmentsScreen mob={mob}/>}
        </main>
        {mob&&!isExam&&!quizUnit&&<BottomNav active={page} onNav={nav}/>}
      </div>
      {/* Sign out confirm */}
      <Modal open={signOutModal} onClose={()=>setSignOutModal(false)} labelledBy="signout-title" maxWidth={400} mob={mob}>
        <div style={{padding:"28px 32px",textAlign:"center"}}>
          <div style={{width:48,height:48,borderRadius:12,background:T.errBg,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}>
            <Ic n="logout" sz={24} color={T.err}/>
          </div>
          <h2 id="signout-title" style={{margin:"0 0 6px",fontWeight:700,fontSize:17,color:T.txt,fontFamily:"Manrope"}}>Sign out of Ednara?</h2>
          <p style={{fontSize:14,color:T.muted,margin:"0 0 20px"}}>You'll need to sign in again to access your courses and assessments.</p>
          <div style={{display:"flex",gap:12,justifyContent:"center"}}>
            <Btn variant="ghost" onClick={()=>setSignOutModal(false)}>Cancel</Btn>
            <Btn style={{background:T.err}} onClick={()=>{setSignOutModal(false);setPage("login");}}>Sign out</Btn>
          </div>
        </div>
      </Modal>

      {/* ── Eddy · global AI learning assistant ──────────────────────────── */}
      <Eddy mob={mob}
        hidden={page==="exam"||page==="practice-session"||!!quizUnit}
        topic={
          page==="course-detail"&&openCourse ? openCourse.title :
          page==="live-classes" ? (LIVE_CLASSES.find(c=>c.status==="live")||LIVE_CLASSES.find(c=>c.status==="today")||{}).subject :
          page==="practice-setup"&&practSub ? practSub.title :
          page==="exam-results"&&viewReport ? viewReport.title :
          page==="assignments" ? "your assignments" :
          undefined
        }/>

      {/* ── Toasts · global, action-feedback notifications ────────────────── */}
      <ToastStack toasts={toasts} onDismiss={dismissToast}/>
    </div>
  );
}


class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error("App crashed:",err,info);}
  render(){
    if(this.state.err){
      return(
        <div style={{padding:"40px",fontFamily:"'Sora',sans-serif",maxWidth:460,margin:"80px auto",textAlign:"center"}}>
          <div style={{width:64,height:64,borderRadius:16,background:"#FEF2F2",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
            <span className="msr" style={{fontSize:32,color:"#DC2626",fontVariationSettings:"'FILL' 1"}}>error</span>
          </div>
          <h2 style={{margin:"0 0 8px",fontSize:20,fontWeight:700,color:"#1F2937"}}>Something went wrong</h2>
          <p style={{color:"#667085",fontSize:14,lineHeight:1.6,margin:"0 0 24px"}}>We couldn't load this page. Try refreshing or go back to the dashboard.</p>
          <button onClick={()=>{this.setState({err:null});window.location.reload();}}
            style={{padding:"10px 24px",background:"#6B2FA7",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            Refresh page
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrBoundary><App/></ErrBoundary>);
</script>
</body>
</html>
