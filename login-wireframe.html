<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Wireframe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: "Courier New", monospace;
      color: #333;
      padding: 16px;
    }
    .box {
      width: 100%;
      max-width: 320px;
      border: 2px solid #333;
      background: #fff;
      padding: 24px;
    }
    .logo {
      height: 48px;
      border: 2px dashed #999;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      margin-bottom: 20px;
    }
    h1 { font-size: 18px; text-align: center; margin: 0 0 20px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 2px solid #333;
      font-family: inherit;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 18px;
    }
    a { color: #333; }
    button {
      width: 100%;
      padding: 10px;
      border: 2px solid #333;
      background: #ddd;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .footer { text-align: center; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <form class="box" onsubmit="return false;">
    <div class="logo">[ LOGO ]</div>
    <h1>Log In</h1>

    <label for="user">Username / Email</label>
    <input type="text" id="user" placeholder="________">

    <label for="pass">Password</label>
    <input type="password" id="pass" placeholder="________">

    <div class="row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">LOGIN</button>

    <div class="footer">No account? <a href="#">Sign up</a></div>
  </form>
</body>
</html>
